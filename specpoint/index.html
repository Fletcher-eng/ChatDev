<title>Specpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,100,400&family=Kalam:wght@400;700&display=swap">
<style>
/* Specpoint: exam paper structure, exercise book annotations, magazine headlines */
:root{
  --paper:#FFFFFF;
  --bg:#F5F6FB;
  --surface:#FFFFFF;
  --ink:#1A2360;
  --ink2:#3E4670;
  --ink3:#646B8C;
  --rule:#1A2360;
  --hair:#D5D9EA;
  --accent:#1A2360;
  --accent-ink:#FFFFFF;
  --accent-soft:#E6EAFB;
  --kt:#FFE14D;
  --btn:#3452F0;
  --btn-ink:#FFFFFF;
  --good:#07874F;
  --good-soft:#D3F5E3;
  --hl:#FFE14D;
  --red:#D92D12;
  --red-soft:#FFE1D9;
  --pen:#1B45B4;
  --margin:#F0A3A3;
  --ruled:#C9DDF0;
  --focus:#1ABCFE;
  --flame:#F24E1E;
  --sticky:#FFE98A;
  --sticky2:#FFC9D6;
  /* diagram colours */
  --cyto:#FCE8EE; --memb:#C2456B; --nuc:#9A7FE0; --nuc2:#6A4DC0; --wall:#7FA33A; --chl:#2E9E4F;
  --vac:#CBE6F6; --vac2:#7DB5D8; --mito:#E8892E; --ribo:#3E454C; --dna:#2F6FDE; --rbc:#D2453F;
  --sans:"Archivo", "Arial", "Helvetica Neue", Helvetica, sans-serif;
  --hand:"Kalam", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#18204A; --bg:#10163A; --surface:#18204A; --ink:#F1F3FF; --ink2:#C3C9EA; --ink3:#949CC6;
    --rule:#C9D0F5; --hair:#2E3870; --accent:#F1F3FF; --accent-ink:#10163A; --accent-soft:#222B62; --btn:#7C93FF; --btn-ink:#0D1233; --kt:rgba(255,225,77,.34);
    --good:#3DDC97; --good-soft:#0F3322; --hl:#FFE14D; --red:#FF7A63; --red-soft:#3D1710; --pen:#8AB0FF;
    --margin:#7A3434; --ruled:#23303B; --focus:#1ABCFE; --flame:#FF7262;
    --cyto:#3A2630; --memb:#F08AA8; --nuc:#8F78D6; --nuc2:#C2B2F7; --wall:#9FC45A; --chl:#5CC68D;
    --vac:#1D3A4D; --vac2:#5A9CC4; --mito:#F2A65A; --ribo:#C9CFD4; --dna:#7FB0FF; --rbc:#F07068;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#18204A; --bg:#10163A; --surface:#18204A; --ink:#F1F3FF; --ink2:#C3C9EA; --ink3:#949CC6;
  --rule:#C9D0F5; --hair:#2E3870; --accent:#F1F3FF; --accent-ink:#10163A; --accent-soft:#222B62; --btn:#7C93FF; --btn-ink:#0D1233; --kt:rgba(255,225,77,.34);
  --good:#3DDC97; --good-soft:#0F3322; --hl:#FFE14D; --red:#FF7A63; --red-soft:#3D1710; --pen:#8AB0FF;
  --margin:#7A3434; --ruled:#23303B; --focus:#1ABCFE; --flame:#FF7262;
  --cyto:#3A2630; --memb:#F08AA8; --nuc:#8F78D6; --nuc2:#C2B2F7; --wall:#9FC45A; --chl:#5CC68D;
  --vac:#1D3A4D; --vac2:#5A9CC4; --mito:#F2A65A; --ribo:#C9CFD4; --dna:#7FB0FF; --rbc:#F07068;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;font-stretch:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hand{font-family:var(--hand)}

/* headline type: condensed and heavy, like a magazine cover */
.hello h1,.band h1,.ob-h,.h2,.notes h2,.mark,.answer-big,.big,.toc .n,.band .num,.stat b,.eq-top .qn,.marks{font-family:var(--sans);font-stretch:68%;font-weight:900;text-transform:uppercase;letter-spacing:-.005em}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:3px solid var(--rule)}
.bar-in{max-width:1080px;margin:0 auto;padding:0 16px;min-height:58px;display:flex;align-items:center;gap:14px}
.mark{border:0;background:none;padding:6px 0;min-height:44px;font-size:30px;line-height:1;display:flex;align-items:center;gap:8px}
.mark .dot{width:22px;height:22px;display:grid;place-items:center;background:var(--hl);border:2.5px solid var(--ink);border-radius:50%}
.mark .dot i{display:none}
.crumbs{display:flex;gap:6px;align-items:center;font-size:15px;color:var(--ink3);min-width:0;overflow:hidden;white-space:nowrap;flex:1}
.crumbs button{border:0;background:none;padding:10px 2px;min-height:44px;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.crumbs span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.crumbs > *{display:none}.crumbs .parent{display:block}.crumbs .parent::before{content:"‹ "}}
.pill{display:flex;align-items:center;gap:12px;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.pill .streak{display:flex;align-items:center;gap:3px;color:var(--flame)}
.pill .xp{background:var(--btn);color:var(--btn-ink);padding:3px 8px}
@media (max-width:420px){.pill .xp{display:none}}
.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.3)}}

.page{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}

/* buttons */
.btn{border:2.5px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:0;padding:10px 20px;min-height:48px;font-weight:800;font-size:16px;letter-spacing:.01em;transition:background .12s ease,color .12s ease}
.btn:hover:not(:disabled){background:var(--hl);color:#1A2360;border-color:var(--ink)}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.quiet:hover:not(:disabled){background:var(--hl);color:#1A2360}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.link-btn{border:0;background:none;padding:10px 0;min-height:44px;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;font-size:15px;text-align:left;align-self:flex-start}
.link-btn:disabled{opacity:.4}

/* home */
.hello{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.hello h1{font-size:clamp(52px,12vw,124px);line-height:.86;margin:0;overflow-wrap:anywhere}
.hello p{margin:4px 0 0;color:var(--ink2);font-size:17px;font-weight:600}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px solid var(--rule);border-bottom:3px solid var(--rule);margin-bottom:0}
.today > div{padding:14px 10px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.today > div:first-child{padding-left:0}
.today > div + div{border-left:1.5px solid var(--rule)}
.today .lbl{font-size:13px;color:var(--ink3);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.today .big{font-size:clamp(30px,9vw,44px);line-height:.95;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.today .big small{font-size:18px;color:var(--ink2)}
.ring{width:34px;height:34px;transform:rotate(-90deg)}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 0;margin-bottom:34px;border-bottom:3px solid var(--rule)}
.next small{display:block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.next b{font-size:24px;font-weight:800;background:linear-gradient(transparent 55%,var(--kt) 55%);color:var(--ink)}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.h2{font-size:40px;line-height:1;margin:0 0 16px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:22px 16px;margin:0;padding:0;list-style:none}
.book{position:relative;width:100%;aspect-ratio:3/4;border:2.5px solid #1A2360;border-radius:2px 8px 8px 2px;background:var(--c);color:#1A2360;padding:12px 10px 10px 18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  box-shadow:inset 8px 0 0 rgba(0,0,0,.18);transition:transform .18s ease}
.book:not(:disabled):hover{transform:translateY(-6px) rotate(-2deg)}
.book:disabled{cursor:default}
.label{background:#FFFEF7;color:#1A2360;border:1.5px solid #1A2360;padding:5px 6px 4px;margin-right:-2px;display:flex;flex-direction:column;gap:1px;
  background-image:repeating-linear-gradient(transparent 0 21px,#C9DDF0 21px 22px);background-position:0 16px}
.label small{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#555;font-weight:800;line-height:1.2}
.label span{font-family:var(--hand);font-weight:700;font-size:15.5px;line-height:1.2;color:#1B45B4;hyphens:auto}
.book .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;font-size:14px;font-weight:800}
.book .foot .code{font-variant-numeric:tabular-nums}
.sticker{background:#1A2360;color:#fff;padding:2px 7px;font-size:13px;transform:rotate(-5deg);display:inline-block}
.book .bar-p{height:7px;background:rgba(0,0,0,.18);overflow:hidden;margin-top:6px}
.book .bar-p i{display:block;height:100%;background:#1A2360}
.qz{display:inline-block;font-family:var(--hand);font-weight:700;font-size:16px;line-height:1.2;color:#1A2360;margin:0 4px 2px 0;transform:rotate(-3deg)}
.fine{font-size:15px;color:var(--ink3);margin-top:20px;max-width:62ch}

/* colour band: magazine cover with Figma style shapes */
.band{background:var(--c,#0ACF83);color:#1A2360;padding:22px 20px 20px;margin-bottom:22px;position:relative;overflow:hidden;border:3px solid #1A2360}
.band .code{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;position:relative}
.band h1{font-size:clamp(44px,9vw,92px);line-height:.88;margin:8px 0 12px;text-wrap:balance;max-width:14ch;position:relative;overflow-wrap:anywhere}
.band p{margin:0;max-width:56ch;font-weight:600;position:relative}
.band .num{position:absolute;right:12px;bottom:-24px;font-size:200px;line-height:1;color:#1A2360;opacity:.14;pointer-events:none}
.shapes{position:absolute;right:18px;top:16px;display:flex;gap:8px;pointer-events:none}
.shapes i{width:34px;height:34px;border:3px solid #1A2360;display:block}
.shapes i:nth-child(1){border-radius:50%;background:#fff}
.shapes i:nth-child(2){background:#FFE14D;transform:rotate(12deg)}
.shapes i:nth-child(3){border-radius:34px 34px 0 0;height:17px;align-self:flex-end;background:#1A2360}
@media (max-width:520px){.shapes{display:none}}

/* syllabus list: ruled like a contents page */
.toc{margin:0;padding:0;list-style:none;border-top:3px solid var(--rule)}
.toc li{border-bottom:1.5px solid var(--rule)}
.toc button{width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;min-height:58px;transition:background .12s ease}
.toc button:not(:disabled):hover{background:var(--hl);color:#1A2360}
.toc .n{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.toc .t{font-size:19px;font-weight:800}
.toc .subs{display:block;font-size:15px;color:var(--ink2);font-weight:500;margin-top:2px}
.toc button:not(:disabled):hover .subs{color:#333}
.toc button:disabled{cursor:default}
.toc button:disabled .t,.toc button:disabled .n{color:var(--ink3);font-weight:600}
.meter{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.meter svg{width:28px;height:28px;transform:rotate(-90deg)}

/* tabs: plain words, thick underline */
.tabs{display:flex;gap:22px;margin-bottom:28px;overflow-x:auto;scrollbar-width:none;border-bottom:3px solid var(--rule)}
.tabs button{border:0;background:none;padding:10px 0;min-height:48px;font-weight:800;font-size:17px;color:var(--ink3);white-space:nowrap;border-bottom:6px solid transparent;margin-bottom:-3px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--btn)}
.tabs button:hover{color:var(--ink)}
.tabs .count{font-weight:600;font-size:14px;margin-left:5px}

/* notes: a page with a red margin */
.notes-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
@media (min-width:900px){.notes-grid{grid-template-columns:200px minmax(0,1fr)}}
.side{font-size:16px}
@media (min-width:900px){.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start}}
.side h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 4px;font-weight:800}
.side ol{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--rule)}
.side li{border-bottom:1.5px solid var(--rule)}
.side a{display:flex;gap:10px;padding:10px 0;min-height:46px;align-items:center;color:var(--ink);text-decoration:none;font-weight:700}
.side a:hover{background:var(--hl);color:#1A2360}
.tick{width:20px;height:20px;border:2px solid var(--ink);flex:none;display:grid;place-items:center}
.tick.on{background:var(--good);border-color:var(--good)}
.tick.on::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}

.notes{min-width:0;max-width:72ch;background:var(--paper);border:1.5px solid var(--hair);padding:22px 20px 22px 34px;position:relative;font-size:18px;line-height:1.65}
.notes::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--margin)}
.notes section{padding-bottom:30px;margin-bottom:30px;border-bottom:3px solid var(--rule);scroll-margin-top:90px}
.notes section:last-of-type{border-bottom:0}
.notes h2{font-size:clamp(38px,6vw,54px);line-height:.92;margin:0 0 16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.notes h2 .ref{font-size:.6em;color:var(--ink);background:var(--hl);padding:0 8px;color:#1A2360}
.notes h3{font-size:19px;font-weight:800;margin:30px 0 8px;padding-top:10px;border-top:1.5px solid var(--rule)}
.notes p{margin:0 0 14px}
.notes ul,.notes ol{margin:0 0 14px;padding-left:1.3em}
.notes li{margin-bottom:6px}
.kt{font-weight:700;padding:0 2px;background-image:linear-gradient(100deg,var(--kt) 0,var(--kt) 97%,transparent 100%);background-repeat:no-repeat;background-size:100% 46%;background-position:0 88%}
:root[data-theme="dark"] .kt,.kt{color:inherit}
.kt.wait{background-size:0% 46%}
.kt.go{transition:background-size .8s cubic-bezier(.3,.8,.3,1)}
.sup{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--btn);color:var(--btn);padding:0 6px;vertical-align:3px;white-space:nowrap}

/* sticky notes for tips, red pen for mistakes */
.box{font-size:17px;line-height:1.5;padding:20px 18px 16px;margin:24px 6px 22px;position:relative;background:var(--sticky);color:#1A2360;transform:rotate(-.8deg);box-shadow:0 8px 14px -8px rgba(0,0,0,.35);max-width:52ch}
.box::before{content:"";position:absolute;top:-11px;left:50%;width:84px;height:22px;margin-left:-42px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.08);transform:rotate(-3deg)}
.box > b:first-child{display:block;font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.1;margin-bottom:4px;color:#1A2360}
.box strong{font-weight:800}
.box.trap{background:var(--sticky2);transform:rotate(.7deg);margin-left:auto;margin-right:6px}
.box.trap > b:first-child{color:#C4210A}
.formula{font-size:18px;font-weight:700;border:2.5px solid var(--rule);padding:14px 16px;margin:16px 0;display:flex;flex-direction:column;gap:6px;overflow-x:auto;background:var(--paper);font-variant-numeric:tabular-nums}
.work{font-size:17px;border-left:4px solid var(--btn);padding:4px 0 4px 16px;margin:18px 0}
.work .q{font-weight:900;font-stretch:68%;text-transform:uppercase;font-size:22px;margin-bottom:6px}
.work ol{margin:0;padding-left:1.3em}
.flow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:16px;margin:10px 0 16px}
.flow span{border:2px solid var(--ink);padding:5px 10px;font-weight:800;background:var(--paper)}
.flow i{font-style:normal;font-weight:900}
.tbl{overflow-x:auto;margin:16px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:16px;line-height:1.4;border:2.5px solid var(--rule);background:var(--paper)}
.tbl th,.tbl td{padding:9px 11px;border:1.5px solid var(--rule);text-align:left;vertical-align:top}
.tbl th{font-weight:800;white-space:nowrap;background:var(--accent-soft)}
.tbl td.c{text-align:center;white-space:nowrap}
.yes{font-weight:900;color:var(--good)}
.no{color:var(--ink3)}
.done-row{font-size:17px;margin-top:14px}
.check{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:800}
.check input{width:24px;height:24px;accent-color:var(--good)}

/* figures, labelled like an exam paper */
.widget{font-size:16px;border:2.5px solid var(--rule);background:var(--paper);padding:16px;margin:20px 0 6px;display:flex;flex-direction:column;gap:12px;position:relative}
.widget .wt{font-weight:800;font-size:15px;align-self:flex-start;background:var(--btn);color:var(--btn-ink);padding:3px 10px;margin:-16px 0 0 -16px}
.seg{display:flex;border:2.5px solid var(--ink);flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;min-height:46px;padding:8px 12px;font-weight:800;color:var(--ink)}
.seg button + button{border-left:2.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.seg button:not([aria-pressed="true"]):hover{background:var(--hl);color:#1A2360}
.cellsvg{width:100%;max-width:440px;height:auto;align-self:center;display:block}
.cellsvg [data-part]{cursor:pointer;transition:opacity .2s ease, filter .2s ease}
.cellsvg.picked [data-part]:not(.on){opacity:.3}
.cellsvg [data-part]:hover{filter:brightness(1.12)}
.cellsvg [data-part]:focus{outline:none}
.cellsvg [data-part]:focus-visible{filter:drop-shadow(0 0 3px var(--focus))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--ink);background:var(--paper);padding:8px 10px;min-height:44px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.chips button i{width:12px;height:12px;flex:none;border:1.5px solid var(--ink)}
.chips button[aria-pressed="true"]{background:var(--hl);color:#1A2360}
.info{border-top:2.5px solid var(--rule);padding-top:10px;min-height:78px}
.info b{font-size:22px;font-weight:900;font-stretch:68%;text-transform:uppercase;display:block}
.info .in{font-family:var(--hand);font-size:18px;color:var(--pen);margin-top:2px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:800}
.fields input{border:0;border-bottom:2.5px solid var(--ink);padding:8px 2px;min-height:48px;background:transparent;font-size:24px;font-weight:700;width:100%;font-variant-numeric:tabular-nums}
.fields input:focus{outline:none;background:var(--hl);color:#1A2360}
.answer-big{font-size:64px;line-height:.9}
.steps{font-size:16px;color:var(--ink2);display:flex;flex-direction:column;gap:2px;overflow-x:auto;font-family:var(--hand);color:var(--pen);font-size:19px}
.range{width:100%;height:44px;accent-color:var(--ink);cursor:pointer}
.scale{display:flex;justify-content:space-between;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.osmo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:2px solid var(--rule)}
.osmo figure{margin:0;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.osmo figure + figure{border-left:2px solid var(--rule)}
.osmo svg{width:100%;height:auto;max-width:220px}
.osmo figcaption{font-size:15px;font-weight:800;text-align:center}
.osmo figcaption span{display:block;font-family:var(--hand);font-size:20px;color:var(--pen)}
.state{font-weight:700;border-left:5px solid var(--hl);padding:4px 0 4px 12px}

/* multiple choice, like Paper 2 */
.qc{font-size:17px;border-top:3px solid var(--rule);border-bottom:3px solid var(--rule);padding:14px 0;margin:28px 0 6px;display:flex;flex-direction:column;gap:10px}
.qc .tag{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--hl);color:#1A2360;align-self:flex-start;padding:2px 8px}
.qc .qt,.fq .qt{font-size:20px;font-weight:800;line-height:1.3;margin:0}

<script>
/* ================= CONTENT ================= */
const SUBJECTS = [
  {id:"bio",  name:"Biology", code:"0610", live:true},
  {id:"chem", name:"Chemistry", code:"0620"},
  {id:"phys", name:"Physics", code:"0625"},
  {id:"math", name:"Mathematics", code:"0580"},
  {id:"eng",  name:"English First Language", code:"0500"},
  {id:"lit",  name:"Literature in English", code:"0475"},
  {id:"dt",   name:"Design and Technology", code:"0445"},
  {id:"econ", name:"Economics", code:"0455"},
  {id:"gp",   name:"Global Perspectives", code:"0457"},
  {id:"spa",  name:"Spanish", code:"0530"}
];

const BIO_TOPICS = [
  "Characteristics and classification of living organisms","Organisation of the organism","Movement into and out of cells",
  "Biological molecules","Enzymes","Plant nutrition","Human nutrition","Transport in plants","Transport in animals",
  "Diseases and immunity","Gas exchange in humans","Respiration","Excretion in humans","Coordination and response",
  "Drugs","Reproduction","Inheritance","Variation and selection","Organisms and their environment",
  "Human influences on ecosystems","Biotechnology and genetic engineering"
];

const Y = '<span class="yes" aria-label="yes">Yes</span>', N = '<span class="no" aria-label="no">No</span>';
const SUP = '<span class="sup" title="Supplement content, needed for Extended papers">Supplement</span>';

const TOPICS = {
  2: {
    subs: [
      {ref:"2.1", title:"Cell structure", check:{q:"Which structure do plant cells share with bacteria but NOT with animal cells?",a:"Cell wall",w:["Chloroplasts","Nucleus","Large permanent vacuole"],t:"Bacteria have a cell wall too, but it is not made of cellulose."}, html:`
<p>All living organisms are made of cells. <span class="kt">New cells are produced by division of existing cells.</span> Animal, plant and bacterial cells share some structures and differ in others, and the exam asks you to compare them.</p>

<h3>Explore the cells</h3>
<p>Tap any part of the cell to see what it does. Switch between the three cell types to compare them.</p>
<div data-widget="cellmap"></div>

<h3>Structures and what they do</h3>
<div class="tbl"><table>
<thead><tr><th>Structure</th><th>Function</th><th>Animal</th><th>Plant</th><th>Bacterium</th></tr></thead>
<tbody>
<tr><td>Cell membrane</td><td>Controls what enters and leaves the cell. It is partially permeable.</td><td class="c">${Y}</td><td class="c">${Y}</td><td class="c">${Y}</td></tr>
<tr><td>Cytoplasm</td><td>Where most chemical reactions in the cell take place.</td><td class="c">${Y}</td><td class="c">${Y}</td><td class="c">${Y}</td></tr>
<tr><td>Ribosomes</td><td>Protein synthesis.</td><td class="c">${Y}</td><td class="c">${Y}</td><td class="c">${Y}</td></tr>
<tr><td>Nucleus</td><td>Contains the genetic material (chromosomes) that controls the cell.</td><td class="c">${Y}</td><td class="c">${Y}</td><td class="c">${N}</td></tr>
<tr><td>Mitochondria</td><td>Aerobic respiration, which releases energy.</td><td class="c">${Y}</td><td class="c">${Y}</td><td class="c">${N}</td></tr>
<tr><td>Cell wall</td><td>Strengthens the cell and keeps its shape. Made of cellulose in plants.</td><td class="c">${N}</td><td class="c">${Y}</td><td class="c">${Y}</td></tr>
<tr><td>Chloroplasts</td><td>Absorb light energy for photosynthesis.</td><td class="c">${N}</td><td class="c">${Y}</td><td class="c">${N}</td></tr>
<tr><td>Large permanent vacuole</td><td>Contains cell sap. Helps keep the cell firm.</td><td class="c">${N}</td><td class="c">${Y}</td><td class="c">${N}</td></tr>
<tr><td>Circular DNA and plasmids</td><td>Genetic material of a bacterium.</td><td class="c">${N}</td><td class="c">${N}</td><td class="c">${Y}</td></tr>
</tbody></table></div>

<div class="box tip"><b>Examiner tip</b>Plant cells have three structures that animal cells lack: a <strong>cell wall</strong>, <strong>chloroplasts</strong> and a <strong>large permanent vacuole</strong>. When a question asks you to compare them, name all three. Bacteria have a cell wall too, but it is not made of cellulose.</div>
<div class="box trap"><b>Common mistake</b>Saying the cell wall controls what enters the cell. The cell wall is fully permeable. Only the <strong>cell membrane</strong> controls entry and exit.</div>

<h3>Specialised cells</h3>
<p>Cells become <span class="kt">specialised</span> so they can carry out one job well. Learn the function of each cell below and one way its structure helps.</p>
<div class="tbl"><table>
<thead><tr><th>Cell</th><th>Function</th><th>How it is adapted</th></tr></thead>
<tbody>
<tr><td>Ciliated cell</td><td>Moves mucus in the trachea and bronchi</td><td>Cilia beat to sweep mucus, with trapped dust and pathogens, away from the lungs</td></tr>
<tr><td>Root hair cell</td><td>Absorbs water and mineral ions</td><td>Long extension gives a large surface area</td></tr>
<tr><td>Palisade mesophyll cell</td><td>Photosynthesis</td><td>Packed with chloroplasts</td></tr>
<tr><td>Neurone</td><td>Conducts electrical impulses</td><td>Long fibre carries impulses over long distances</td></tr>
<tr><td>Red blood cell</td><td>Transports oxygen</td><td>Contains haemoglobin and has no nucleus, leaving more room for it</td></tr>
<tr><td>Sperm and egg cells</td><td>Reproduction</td><td>Sperm have a flagellum to swim. Egg cells have a large food store in the cytoplasm</td></tr>
</tbody></table></div>

<h3>Levels of organisation</h3>
<div class="flow" aria-label="Cell, then tissue, then organ, then organ system, then organism"><span>Cell</span><i>→</i><span>Tissue</span><i>→</i><span>Organ</span><i>→</i><span>Organ system</span><i>→</i><span>Organism</span></div>
<ul>
<li><span class="kt">Tissue</span>: a group of cells with similar structures, working together to perform a shared function. Example: muscle tissue.</li>
<li><span class="kt">Organ</span>: a structure made of a group of tissues, working together to perform specific functions. Example: the heart.</li>
<li><span class="kt">Organ system</span>: a group of organs with related functions, working together to perform body functions. Example: the circulatory system.</li>
</ul>`},
      {ref:"2.2", title:"Size of specimens", check:{q:"An image is 20 mm long. The real object is 0.5 mm long. What is the magnification?",a:"×40",w:["×10","×0.025","×100"],t:"Image size ÷ actual size: 20 ÷ 0.5 = ×40."}, html:`
<p>Microscopes make cells look bigger. To work out how much bigger, you use the magnification formula. This is one of the most reliable calculation marks on Paper 4.</p>
<div class="formula" aria-label="Magnification formula">
<span>magnification = image size ÷ actual size</span>
<span>actual size = image size ÷ magnification</span>
<span>image size = actual size × magnification</span>
</div>
<p>Magnification has <span class="kt">no units</span>. Write it with a times sign, for example <strong>×400</strong>.</p>

<h3>Millimetres and micrometres ${SUP}</h3>
<p>Cells are tiny, so their actual size is often given in micrometres (µm).</p>
<div class="formula"><span>1 mm = 1000 µm</span><span>mm to µm: multiply by 1000</span><span>µm to mm: divide by 1000</span></div>
<p>Before you divide, <span class="kt">both sizes must be in the same unit</span>.</p>

<div class="work">
<div class="q">Worked example 1</div>
<p style="margin:0 0 8px">A drawing of a cheek cell is 45 mm wide. The real cell is 60 µm wide. Calculate the magnification.</p>
<ol><li>Convert to the same unit: 60 µm ÷ 1000 = 0.06 mm</li><li>Image size ÷ actual size: 45 ÷ 0.06 = 750</li><li>Answer: <strong>×750</strong></li></ol>
</div>
<div class="work">
<div class="q">Worked example 2</div>
<p style="margin:0 0 8px">An image of a cell is 30 mm long at ×400. Find its actual length in µm.</p>
<ol><li>Actual size = 30 ÷ 400 = 0.075 mm</li><li>Convert: 0.075 × 1000 = <strong>75 µm</strong></li></ol>
</div>

<p><span class="kt">Diffusion</span> is the net movement of particles from a region of higher concentration to a region of lower concentration, down a concentration gradient, as a result of their random movement.</p>
<p>The energy for diffusion comes from the <span class="kt">kinetic energy of random movement</span> of molecules and ions. The cell does not use energy from respiration, so diffusion is a passive process.</p>
<p>Substances move into and out of cells by diffusion through the cell membrane. Examples include oxygen and carbon dioxide during gas exchange, and dissolved substances (solutes) moving between cells and the fluid around them.</p>

<h3>What changes the rate of diffusion</h3>
<div class="tbl"><table>
<thead><tr><th>Factor</th><th>Faster diffusion when…</th><th>Why</th></tr></thead>
<tbody>
<tr><td>Surface area</td><td>Larger</td><td>More space for particles to cross at once</td></tr>
<tr><td>Temperature</td><td>Higher</td><td>Particles have more kinetic energy and move faster</td></tr>
<tr><td>Concentration gradient</td><td>Steeper</td><td>Bigger difference means more net movement</td></tr>
<tr><td>Distance</td><td>Shorter</td><td>Particles have less far to travel</td></tr>
</tbody></table></div>
<div class="box tip"><b>Examiner tip</b>Always write <strong>net movement</strong> in your definition. Particles move both ways, but more move from high to low concentration.</div>`},
      {ref:"3.2", title:"Osmosis", check:{q:"Which word describes a plant cell full of water, pressing on its cell wall?",a:"Turgid",w:["Flaccid","Plasmolysed","Burst"],t:"Turgid cells push outwards on the wall. That turgor pressure supports the plant."}, html:`
<p>Water diffuses through partially permeable membranes by <span class="kt">osmosis</span>. Water moves into and out of cells by osmosis through the cell membrane.</p>
<p>${SUP} The full definition: osmosis is the net movement of water molecules from a region of <span class="kt">higher water potential</span> (a dilute solution) to a region of <span class="kt">lower water potential</span> (a concentrated solution), through a partially permeable membrane.</p>

<h3>Plant cells ${SUP}</h3>
<ul>
<li>In a dilute solution, water enters by osmosis. The cell becomes <span class="kt">turgid</span>. Water pushing outwards on the cell wall creates <span class="kt">turgor pressure</span>, which supports the plant.</li>
<li>In a concentrated solution, water leaves by osmosis. The cell becomes <span class="kt">flaccid</span>. If it loses a lot of water, the membrane pulls away from the cell wall. This is <span class="kt">plasmolysis</span>.</li>
<li>A plant wilts when its cells become flaccid and lose turgor pressure.</li>
</ul>
<h3>Animal cells ${SUP}</h3>
<p>Animal cells have no cell wall. In a dilute solution they gain water and can <span class="kt">burst</span>. In a concentrated solution they lose water and <span class="kt">shrink</span>. This is why the water potential of blood plasma must be kept steady.</p>

<h3>See it happen</h3>
<div data-widget="osmosis"></div>

<h3>The potato practical</h3>
<p>Cylinders of potato are weighed, left in sucrose solutions of different concentrations, then blotted dry and weighed again.</p>
<div class="formula"><span>percentage change = (change in mass ÷ starting mass) × 100</span></div>
<p>A gain in mass means water entered. A loss means water left. Where the mass does not change, the water potential of the potato equals that of the solution.</p>
<div class="box trap"><b>Common mistake</b>Saying "water moves from high concentration to low concentration". That describes the solute, not water. Talk about <strong>water potential</strong>, or about moving from a dilute to a concentrated solution.</div>`},
      {ref:"3.3", title:"Active transport", check:{q:"Why do cells that carry out lots of active transport have many mitochondria?",a:"To release more energy from respiration",w:["To make more protein carriers","To store water","To absorb light"],t:"Active transport needs energy from respiration, and respiration happens in mitochondria."}, html:`
<p><span class="kt">Active transport</span> is the movement of particles through a cell membrane from a region of lower concentration to a region of higher concentration, using energy from respiration. It moves substances <strong>against</strong> a concentration gradient.</p>
<p>Example: root hair cells take in mineral ions from the soil by active transport, because the soil has a lower concentration of ions than the cell.</p>
<p>${SUP} <span class="kt">Protein carriers</span> in the membrane move the molecules or ions across during active transport.</p>

<h3>Comparing the three processes</h3>
<div class="tbl"><table>
<thead><tr><th></th><th>Diffusion</th><th>Osmosis</th><th>Active transport</th></tr></thead>
<tbody>
<tr><td>What moves</td><td>Any particles</td><td>Water only</td><td>Molecules or ions</td></tr>
<tr><td>Direction</td><td>Down the gradient</td><td>Higher to lower water potential</td><td>Against the gradient</td></tr>

<tr><td>Needs a membrane</td><td>${N}</td><td>${Y}, partially permeable</td><td>${Y}, with protein carriers</td></tr>
</tbody></table></div>
<div class="box tip"><b>Examiner tip</b>If a question mentions a cell with lots of mitochondria, think active transport. More mitochondria means more respiration to supply the energy.</div>`}

const goalXP = () => (S.profile && S.profile.goal) || 30;
const dayKey = d => d.toLocaleDateString("en-CA");
const todayXP = () => S.days[dayKey(new Date())] || 0;
function streak(){
  const d = new Date(); if(!S.days[dayKey(d)]) d.setDate(d.getDate()-1);
  let c = 0; while(S.days[dayKey(d)] > 0){ c++; d.setDate(d.getDate()-1); }
  return c;
}
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* award XP once per key (key null = always) */
function earn(key, n, label){
  if(key){ if(S.earned[key]) return; S.earned[key] = 1; }
  const before = todayXP();
  S.xp += n; S.days[dayKey(new Date())] = before + n; save();
  toast(`<b>+${n} XP</b> ${label||""}`);
  drawPill(true);
  if(before < goalXP() && before + n >= goalXP()){ setTimeout(()=>{ toast(`Daily goal done. <b>Streak ${streak()}</b>`); confetti(innerWidth/2, innerHeight*0.4); }, 900); }
}
function toast(html){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.innerHTML = html;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 1900);
}
function confetti(x, y){
  if(REDUCED) return;
  const cols = ["#FFE14D","#0ACF83","#F24E1E","#1ABCFE","#FF7262","#3452F0"];
  for(let i=0;i<26;i++){
    const c = document.createElement("i"); c.className = "confetti";
    const a = Math.random()*Math.PI*2, r = 80 + Math.random()*160;
    c.style.cssText = `left:${x}px;top:${y}px;background:${cols[i%cols.length]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r + 120}px;--r:${Math.random()*720-360}deg`;
    document.body.appendChild(c); setTimeout(()=>c.remove(), 1200);
  }
}
const FLAME = `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z" fill="currentColor"/></svg>`;
function drawPill(bump){
  const p = document.getElementById("pill");
  p.innerHTML = `<span class="streak ${bump?"pop":""}" title="Days in a row">${FLAME}${streak()}</span><span class="xp ${bump?"pop":""}">${S.xp} XP</span>`;
  p.setAttribute("aria-label", `${streak()} day streak, ${S.xp} XP`);
}
function ring(frac, size=34, stroke=5, col="var(--accent)"){
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--hair)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*Math.min(1,frac)} ${c}"/></svg>`;
}

function topicProgress(n){
  const t = TOPICS[n]; if(!t) return 0;
  const parts = t.subs.length*3 + t.cards.length + t.exam.reduce((s,q)=>s+q.marks,0) + 3;
  let got = t.subs.filter(s=>S.revised[s.ref]).length*3;
  got += t.cards.filter((c,i)=>S.cards[`${n}-${i}`]).length;
  got += t.exam.reduce((s,q)=>s+Math.min(q.marks, S.exam[q.id]||0),0);
  if(S.boss[n]) got += 3;
  return Math.round(100*got/parts);
}

/* ================= SETUP / SIGN UP ================= */
let OB = null;
function renderSetup(){
  setCrumbs([]);
  if(!OB){
    const p = S.profile;
    OB = p ? {step:2, name:p.name, year:p.year, board:p.board, boards:{...(p.boards||{})}, subs:{...p.subs}, tiers:{...p.tiers}, examYear:p.examYear, goal:p.goal, editing:true}
           : {step:0, name:"", year:"10", board:"cie", boards:{}, subs:{}, tiers:{}, examYear:2028, goal:30};
  }
  const steps = ["You","Exam board","Subjects","Goals","Quiz"];
  const stepIdx = Math.min(OB.step, 4);
  const avail = c => OB.board==="mix" ? true : !!c[OB.board];
  const bOf = id => { const c = CATALOG.find(x=>x.id===id); if(OB.board!=="mix") return OB.board; return OB.boards[id] || (c.cie ? "cie" : "edx"); };
  OB.bOf = bOf;
  const chosen = CATALOG.filter(c=>OB.subs[c.id] && avail(c));
  const seg = (name, opts, val) => `<div class="seg" role="group" aria-label="${name}">${opts.map(([v,l])=>`<button data-seg="${name}" data-v="${v}" aria-pressed="${String(v)===String(val)}">${l}</button>`).join("")}</div>`;
  let body = "", canNext = true, nextLbl = "Next";
  if(OB.step===0){
    body = `<h1 class="ob-h">${OB.editing?"Your account":"Create your free account"}</h1>
      <p class="ob-p">Tell us what you study and we will build your revision around it. It takes about two minutes and finishes with a quick quiz on your subjects.</p>
      <label class="ob-field" for="ob-name">First name<input id="ob-name" autocomplete="given-name" value="${esc(OB.name)}" placeholder="What should we call you?"></label>
      <div class="ob-field"><span>Year group</span>${seg("year",[["9","Year 9"],["10","Year 10"],["11","Year 11"]],OB.year)}</div>
      ${OB.year==="9"?`<p class="ob-p">Lots of schools start IGCSE courses in Year 9 and spread them over three years. If yours starts later, the notes are still a great way to get ahead.</p>`:""}`;
    canNext = OB.name.trim().length>0;
  } else if(OB.step===1){
    body = `<h1 class="ob-h">Which exam boards?</h1><p class="ob-p">Lots of schools use different boards for different subjects. Check the front of a past paper or ask your teacher if you are not sure.</p>
      <div class="boards">${Object.entries(BOARDS).map(([k,b])=>`<button class="board" data-board="${k}" aria-pressed="${OB.board===k}"><b>${b.name}</b><span>${b.full} for every subject</span></button>`).join("")}
      <button class="board" data-board="mix" aria-pressed="${OB.board==="mix"}"><b>Both</b><span>A mix. You will choose the board for each subject.</span></button></div>`;
  } else if(OB.step===2){
    const needsSetup = c => c.tier || (OB.board==="mix" && c.cie && c.edx);
    const codes = c => OB.board==="mix" ? [c.cie, c.edx].filter(Boolean).join(" or ") : c[OB.board];
    body = `<h1 class="ob-h">Pick your subjects</h1><p class="ob-p">Tap every subject you take. <b>${chosen.length} chosen</b></p>
      <div class="picks">${CATALOG.filter(avail).map(c=>{const s=subInfo(c.id,bOf(c.id));return `<button class="pick" data-sub="${c.id}" aria-pressed="${!!OB.subs[c.id]}" style="--c:${COVERS[c.id]}"><i aria-hidden="true"></i><span>${esc(s.label)}</span><small>${codes(c)}</small></button>`;}).join("")}</div>
      ${chosen.some(needsSetup)?`<h2 class="ob-h2">${OB.board==="mix"?"Board and tier for each subject":"Which tier are you taking?"}</h2><div class="tiers">${chosen.filter(needsSetup).map(c=>{
        const b = bOf(c.id);
        const boardSeg = OB.board==="mix" && c.cie && c.edx ? seg("brd-"+c.id, [["cie","Cambridge"],["edx","Edexcel"]], b) : "";
        const tierSeg = c.tier ? seg("tier-"+c.id, BOARDS[b].tiers.map(t=>[t,t]), OB.tiers[c.id]||BOARDS[b].tiers[1]) : "";
        return `<div class="tier-row"><span>${esc(subInfo(c.id,b).label)} <small class="code">${subInfo(c.id,b).code}</small></span><div class="tier-ctl">${boardSeg}${tierSeg}</div></div>`;}).join("")}</div>`:""}
      ${OB.board==="mix" && chosen.some(c=>!(c.cie && c.edx)) ? `<p class="ob-p">${chosen.filter(c=>!(c.cie && c.edx)).map(c=>esc(c.name)).join(", ")} ${chosen.filter(c=>!(c.cie && c.edx)).length===1?"is":"are"} only offered by Cambridge, so we have set ${chosen.filter(c=>!(c.cie && c.edx)).length===1?"it":"them"} to Cambridge.</p>` : ""}`;
    canNext = chosen.length>0;
  } else if(OB.step===3){
    body = `<h1 class="ob-h">Set your goals</h1>
      <div class="ob-field"><span>When are your main exams?</span>${seg("exam",[["2027","May 2027"],["2028","May 2028"],["2029","May 2029"]],OB.examYear)}</div>
      <div class="ob-field"><span>Daily goal</span>${seg("goal",[["20","Chill · 20 XP"],["30","Steady · 30 XP"],["50","Serious · 50 XP"]],OB.goal)}</div>
      <p class="ob-p">About 10 XP is one section of notes read and ticked off.</p>`;
    nextLbl = OB.editing ? "Save" : "Next";
  } else if(OB.step===4){
    const n = chosen.length*2;
    body = `<h1 class="ob-h">Quick quiz on your subjects</h1>
      <p class="ob-p">${n} questions, two for each of your ${chosen.length} subjects. There is no pass mark. It just shows us where you are strongest and where to start.</p>
      <div class="quiz-subs">${chosen.map(c=>`<span style="--c:${COVERS[c.id]}">${esc(subInfo(c.id,bOf(c.id)).label)}</span>`).join("")}</div>`;
    nextLbl = "Start the quiz";
  }
  const enter = OB.shown!==OB.step; OB.shown = OB.step;
  app.innerHTML = `<div class="ob">
    <ol class="ob-steps" aria-label="Sign up progress">${steps.map((s,i)=>`<li class="${i<stepIdx?"done":i===stepIdx?"now":""}"><span>${s}</span></li>`).join("")}</ol>
    <div class="ob-card ${enter?"enter":""}">${body}
      <div class="row ob-nav">${OB.step>0?`<button class="btn quiet" id="ob-back">Back</button>`:""}
      ${OB.step===4?`<button class="btn quiet" id="ob-skip">Skip for now</button>`:""}
      <button class="btn" id="ob-next" ${canNext?"":"disabled"}>${nextLbl}</button></div>
    </div>
    ${OB.editing?`<button class="link-btn" id="ob-cancel">Cancel and go back</button>`:`<p class="fine">Your account is saved on this device for now.</p>`}</div>`;

  const nameIn = document.getElementById("ob-name");
  if(nameIn){ nameIn.oninput = ()=>{ OB.name = nameIn.value; document.getElementById("ob-next").disabled = !OB.name.trim(); }; nameIn.onkeydown = e=>{ if(e.key==="Enter" && OB.name.trim()){ OB.step++; renderSetup(); } }; }
  app.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{
    const k = b.dataset.seg, v = b.dataset.v;
    if(k==="year"){ OB.year = v; if(!OB.examTouched) OB.examYear = EXAM_FOR_YEAR[v]; } else if(k.startsWith("brd-")){ OB.boards[k.slice(4)] = v; delete OB.tiers[k.slice(4)]; } else if(k==="exam"){ OB.examYear = +v; OB.examTouched = true; } else if(k==="goal") OB.goal = +v; else if(k.startsWith("tier-")) OB.tiers[k.slice(5)] = v;
    renderSetup();
  });
  app.querySelectorAll("[data-board]").forEach(b=>b.onclick=()=>{ OB.board = b.dataset.board; OB.tiers = {}; renderSetup(); });
  app.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{ OB.subs[b.dataset.sub] = !OB.subs[b.dataset.sub]; renderSetup(); });
  const back = document.getElementById("ob-back"); if(back) back.onclick = ()=>{ OB.step--; renderSetup(); };
  const cancel = document.getElementById("ob-cancel"); if(cancel) cancel.onclick = ()=>{ OB = null; go({view:"home"}); };
  const skip = document.getElementById("ob-skip"); if(skip) skip.onclick = ()=>finishSetup(null);
  document.getElementById("ob-next").onclick = ()=>{
    if(OB.step===3 && OB.editing) return finishSetup(S.profile.baseline||null);
    if(OB.step===4) return runQuiz(chosen);
    OB.step++; renderSetup(); window.scrollTo(0,0);
  };
}

function finishSetup(baseline){
  const bOf = OB.bOf;
  const subs = {}, boards = {}; CATALOG.forEach(c=>{ if(OB.subs[c.id] && (OB.board==="mix" || c[OB.board])){ subs[c.id] = true; boards[c.id] = bOf(c.id); } });
  const tiers = {}; Object.keys(subs).forEach(id=>{ if(CATALOG.find(c=>c.id===id).tier) tiers[id] = OB.tiers[id] || BOARDS[boards[id]].tiers[1]; });
  const first = !S.profile;
  S.profile = {name:OB.name.trim(), year:OB.year, board:OB.board, boards, subs, tiers, examYear:OB.examYear, goal:OB.goal, baseline};
  S.examYear = OB.examYear; save(); OB = null;
  go({view:"home"});
  if(first){ confetti(innerWidth/2, innerHeight*0.3); earn("signup", 20, "welcome bonus"); }
}

function runQuiz(chosen){
  const qs = []; chosen.forEach(c=>QUIZ[c.id].forEach(q=>qs.push({...q, sub:c.id})));
  const score = {}; chosen.forEach(c=>score[c.id]=0);
  let i = 0;
  const ask = ()=>{
    const q = qs[i], s = subInfo(q.sub, OB.bOf(q.sub)), opts = shuffle([q.a, ...q.w]);
    app.innerHTML = `<div class="ob">
      <div class="quiz-bar" aria-label="Question ${i+1} of ${qs.length}"><i style="width:${100*i/qs.length}%"></i></div>
      <div class="ob-card enter">
        <div class="quiz-top"><span class="quiz-tag" style="--c:${COVERS[q.sub]}">${esc(s.label)}</span><span class="code">${i+1} / ${qs.length}</span></div>
        <p class="ob-q">${esc(q.q)}</p>
        <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
        <button class="link-btn" id="idk">I don't know yet</button>
        <div id="qfb"></div>
      </div></div>`;
    const pickAns = (pick, btn)=>{
      const ok = pick===q.a;
      app.querySelectorAll(".opt").forEach((o,k)=>{ o.disabled = true; if(opts[k]===q.a) o.classList.add("right"); });
      document.getElementById("idk").disabled = true;
      if(btn && !ok) btn.classList.add("wrong");
      if(ok) score[q.sub]++;
      const last = i===qs.length-1;
      document.getElementById("qfb").innerHTML = `<div class="fb ${ok?"":"bad"}"><span class="verdict">${ok?"Correct":pick===null?"No problem. The answer is "+esc(q.a)+".":"The answer is "+esc(q.a)+"."}</span><div class="row"><button class="btn" id="qnext">${last?"See my results":"Next question"}</button></div></div>`;
      const nb = document.getElementById("qnext"); nb.focus({preventScroll:true});
      nb.onclick = ()=>{ if(last) results(); else { i++; ask(); } };
    };
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickAns(opts[+b.dataset.k], b));
    document.getElementById("idk").onclick = ()=>pickAns(null, null);
  };
  const results = ()=>{
    const rows = chosen.map(c=>({c, s:score[c.id]})).sort((a,b)=>a.s-b.s);
    const weakest = rows[0];
    const lbl = s => s===2 ? ["Strong","good"] : s===1 ? ["Getting there","mid"] : ["Start here","low"];
    const total = rows.reduce((t,r)=>t+r.s,0);
    app.innerHTML = `<div class="ob"><div class="ob-card enter">
      <h1 class="ob-h">Your starting point</h1>
      <p class="ob-p">You got <b>${total} out of ${rows.length*2}</b>. Here is how each subject looks right now.</p>
      <ul class="base">${rows.map(r=>`<li style="--c:${COVERS[r.c.id]}"><span class="bn">${esc(subInfo(r.c.id,OB.bOf(r.c.id)).label)}</span><span class="pips" aria-label="${r.s} of 2">${[0,1].map(k=>`<i class="${k<r.s?"on":""}"></i>`).join("")}</span><span class="bl ${lbl(r.s)[1]}">${lbl(r.s)[0]}</span></li>`).join("")}</ul>
      <div class="state">${weakest.s<2 ? `Start with <b>${esc(subInfo(weakest.c.id,OB.bOf(weakest.c.id)).label)}</b>. ${weakest.c.id==="bio" ? "Its notes are ready now." : "Its notes are still being written, so we will let you know when they are ready. Biology is ready now."}` : "Great start across the board. Jump into Biology, the first subject with full notes."}</div>
      <div class="row ob-nav"><button class="btn" id="ob-done">Go to my dashboard</button></div>
    </div></div>`;
    const bl = {}; chosen.forEach(c=>bl[c.id]=score[c.id]);
    document.getElementById("ob-done").onclick = ()=>finishSetup(bl);
    if(total/(rows.length*2) >= 0.75) confetti(innerWidth/2, innerHeight*0.3);
  };
  ask();
}

/* ---------- quick check ---------- */
function quickCheck(el, q, key){
  const opts = shuffle([q.a, ...q.w]);
  el.innerHTML = `<span class="tag">Quick check</span><p class="qt">${esc(q.q)}</p><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div class="qc-fb"></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const pick = opts[+b.dataset.k], ok = pick===q.a;
    el.querySelectorAll(".opt").forEach((o,k)=>{ o.disabled = true; if(opts[k]===q.a) o.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    el.querySelector(".qc-fb").innerHTML = `<div class="fb ${ok?"":"bad"}"><span class="verdict">${ok?"Nice.":"Not quite."}</span><span>${esc(q.t)}</span>${ok?"":`<button class="link-btn" data-retry>Try again</button>`}</div>`;
    const r = el.querySelector("[data-retry]"); if(r) r.onclick = ()=>quickCheck(el, q, key);
    if(ok){ const rc = b.getBoundingClientRect(); confetti(rc.left+rc.width/2, rc.top); earn(key, 5, "quick check"); }
  });
}

      ${s.check?`<div class="qc" data-qc="${s.ref}"></div>`:""}
      <div class="done-row"><label class="check"><input type="checkbox" id="rev-${s.ref}" data-rev="${s.ref}" ${S.revised[s.ref]?"checked":""}> I have revised ${s.ref}</label></div>
    </section>`).join("")}
    <div class="row"><button class="btn" id="to-cards">Test yourself with flashcards</button><button class="btn quiet" id="to-exam">Try exam questions</button></div>
    </article></div>`;
  panel.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{ e.preventDefault(); document.getElementById("s"+a.dataset.jump.replace(".","_")).scrollIntoView({behavior:REDUCED?"auto":"smooth"}); });
  panel.querySelectorAll("[data-rev]").forEach(c=>c.onchange=()=>{
    S.revised[c.dataset.rev] = c.checked; save();
    panel.querySelector(`[data-jump="${c.dataset.rev}"] .tick`).classList.toggle("on", c.checked);
    if(c.checked) earn("rev-"+c.dataset.rev, 10, `for revising ${c.dataset.rev}`);
  });
  T.subs.forEach(s=>{ if(s.check) quickCheck(panel.querySelector(`[data-qc="${s.ref}"]`), s.check, "qc-"+s.ref); });
  panel.querySelectorAll("[data-widget]").forEach(w=>WIDGETS[w.dataset.widget](w));
  document.getElementById("to-cards").onclick = ()=>go({view:"topic", topic:n, tab:"cards"});
  document.getElementById("to-exam").onclick = ()=>go({view:"topic", topic:n, tab:"exam"});
  // highlighter swipes in as key terms scroll into view
  if(!REDUCED && "IntersectionObserver" in window){
    const kts = panel.querySelectorAll(".kt");
    const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ const k=e.target; k.classList.add("go"); requestAnimationFrame(()=>k.classList.remove("wait")); io.unobserve(k); } }), {rootMargin:"0px 0px -12% 0px"});
    kts.forEach(k=>{ k.classList.add("wait"); io.observe(k); });
  }
}

  magcalc(el){
    el.innerHTML = `<div class="widget"><span class="wt">Fig. 2.2 Magnification calculator</span>
      <div class="fields"><label for="mc-img">Image size (mm)<input id="mc-img" inputmode="decimal" value="45"></label><label for="mc-act">Actual size (µm)<input id="mc-act" inputmode="decimal" value="60"></label></div>
      <div class="answer-big" id="mc-out" aria-live="polite"></div><div class="steps" id="mc-steps"></div></div>`;
    const img = el.querySelector("#mc-img"), act = el.querySelector("#mc-act");
    const fmt = x => +x.toPrecision(6);
    const upd = ()=>{
      const i = parseFloat(img.value), a = parseFloat(act.value);
      if(!(i>0) || !(a>0)){ el.querySelector("#mc-out").textContent = "Enter two sizes"; el.querySelector("#mc-steps").innerHTML=""; return; }
      const amm = a/1000, m = i/amm;
      el.querySelector("#mc-out").textContent = "×" + fmt(m).toLocaleString("en-GB");
      el.querySelector("#mc-steps").innerHTML = `<span>1. ${fmt(a)} µm ÷ 1000 = ${fmt(amm)} mm</span><span>2. ${fmt(i)} ÷ ${fmt(amm)} = ${fmt(m)}</span>`;
    };
    img.oninput = act.oninput = upd; upd();
  },
  osmosis(el){
    el.innerHTML = `<div class="widget"><span class="wt">Fig. 3.1 Osmosis lab</span>
      <label for="os-r" style="font-weight:800">Drag to change the solution around the cells</label>
      <input type="range" class="range" id="os-r" min="0" max="100" value="10">
      <div class="scale"><span>Pure water</span><span>Very concentrated</span></div>
      <div class="osmo"><figure id="os-p"></figure><figure id="os-a"></figure></div>
      <div class="state" id="os-s" aria-live="polite"></div></div>`;
    const r = el.querySelector("#os-r");
    const arrows = (dir, show)=> !show ? "" : [[16,75],[184,75]].map(([x,y],i)=>{
      const pointIn = dir==="in"; const flip = (i===0) === pointIn ? 1 : -1;
      return `<g transform="translate(${x} ${y}) scale(${flip} 1)"><path d="M-10 0 h16 M0 -6 l7 6 l-7 6" stroke="var(--dna)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    }).join("");
    const upd = ()=>{
      const v = +r.value;
      const dir = v<40 ? "in" : v>60 ? "out" : "none";
      const s = v<=40 ? 1 : v<=60 ? 0.97 : Math.max(0.6, 0.97 - (v-60)/40*0.4);
      const w = 124*s, h = 94*s, x = 100 - w/2, y = 75 - h/2;
      const vs = v<=40 ? 1 : Math.max(0.35, 1 - (v-40)/60*0.75);
      const plantState = v<40 ? "Turgid" : v<=60 ? "No change" : v<=80 ? "Flaccid" : "Plasmolysed";
      document.getElementById("os-p").innerHTML = `<svg viewBox="0 0 200 150" aria-hidden="true">
        <rect x="32" y="22" width="136" height="106" rx="8" fill="none" stroke="var(--wall)" stroke-width="7"/>
        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${6+ (1-s)*40}" fill="var(--cyto)" stroke="var(--memb)" stroke-width="3" style="transition:all .25s ease"/>
        <rect x="${100-38*vs}" y="${75-26*vs}" width="${76*vs}" height="${52*vs}" rx="${16*vs}" fill="var(--vac)" stroke="var(--vac2)" stroke-width="2" style="transition:all .25s ease"/>
        ${arrows(dir, dir!=="none")}</svg><figcaption>Plant cell<span>${plantState}</span></figcaption>`;
      const rad = v<15 ? 52 : v<40 ? 46 : v<=60 ? 40 : Math.max(26, 40 - (v-60)/40*14);
      const burst = v<15;
      const aState = burst ? "Bursts" : v<40 ? "Swells" : v<=60 ? "No change" : "Shrinks";
      const pts = []; const spikes = v>70 ? 14 : 0;
      for(let k=0;k<56;k++){ const a = k/56*Math.PI*2; const rr = rad + (spikes && k%4===0 ? 5 : 0); pts.push(`${(100+Math.cos(a)*rr).toFixed(1)},${(75+Math.sin(a)*rr).toFixed(1)}`); }
      document.getElementById("os-a").innerHTML = `<svg viewBox="0 0 200 150" aria-hidden="true">
        <polygon points="${pts.join(" ")}" fill="${burst?"none":"var(--rbc)"}" stroke="var(--rbc)" stroke-width="4" ${burst?'stroke-dasharray="10 9"':""} opacity="${burst?.8:1}"/>
        ${burst?"":`<ellipse cx="100" cy="75" rx="${rad*0.45}" ry="${rad*0.3}" fill="rgba(0,0,0,.14)"/>`}
        ${arrows(dir, dir!=="none")}</svg><figcaption>Red blood cell<span>${aState}</span></figcaption>`;
      document.getElementById("os-s").textContent =
        v<40 ? `Dilute solution. Water moves INTO the cells by osmosis. ${burst?"The red blood cell has no wall to stop it, so it bursts.":"The cell wall stops the plant cell bursting."}` :
        v<=60 ? "The solution has the same water potential as the cells. No net movement of water." :
        v<=80 ? "Concentrated solution. Water moves OUT of the cells by osmosis. The plant cell goes flaccid." :
        "Very concentrated. So much water leaves that the membrane pulls away from the cell wall. That is plasmolysis.";
    };
    r.oninput = upd; upd();
  }
};

/* ---------- flashcards ---------- */
function renderCards(panel, n, T){
  let queue = shuffle(T.cards.map((c,i)=>i).filter(i=>!S.cards[`${n}-${i}`]));
  let flipped = false, anim = "";
  function draw(){
    const known = T.cards.filter((c,i)=>S.cards[`${n}-${i}`]).length;
    if(!queue.length){
      panel.innerHTML = `<div class="deck"><div class="card back ${anim}"><span class="side-lbl">Deck complete</span><div class="face">You know all ${T.cards.length} cards in Topic ${n}.</div><div class="hint">Come back in a few days and reset the deck. Spacing out practice is what makes it stick.</div></div>
      <div class="row"><button class="btn" id="reset">Reset deck</button><button class="btn quiet" id="exam">Try exam questions</button></div></div>`;
      document.getElementById("reset").onclick = ()=>{ T.cards.forEach((c,i)=>delete S.cards[`${n}-${i}`]); save(); queue = shuffle(T.cards.map((c,i)=>i)); anim="slide"; draw(); };
      document.getElementById("exam").onclick = ()=>go({view:"topic", topic:n, tab:"exam"});
      return;
    }
    const i = queue[0], [front, back] = T.cards[i];
    panel.innerHTML = `<div class="deck">
      <div class="deck-meta"><span>${known} of ${T.cards.length} known</span><span class="dots" aria-hidden="true">${T.cards.map((c,k)=>`<i class="${S.cards[`${n}-${k}`]?"on":""}"></i>`).join("")}</span></div>
      <button class="card ${flipped?"back":""} ${anim}" id="card" aria-live="polite">
        <span class="side-lbl">${flipped?"Answer":"Question"}</span>
        <span class="face">${esc(flipped?back:front)}</span>
        ${flipped?"":`<span class="hint">Say the answer out loud, then tap to check.</span>`}
      </button>
      <div class="row">${flipped
        ? `<button class="btn quiet" id="again">Not yet</button><button class="btn" id="got">I knew it</button>`
        : `<button class="btn" id="flip">Show answer</button>`}</div></div>`;
    const flip = ()=>{ if(!flipped){ flipped = true; anim="flip"; draw(); } };
    document.getElementById("card").onclick = flip;
    const f = document.getElementById("flip"); if(f) f.onclick = flip;
    const g = document.getElementById("got"); if(g) g.onclick = ()=>{
      S.cards[`${n}-${i}`]=1; save(); queue.shift(); flipped=false; anim="slide";
      earn(`card-${n}-${i}`, 2, "card learned");
      if(!queue.length){ const rc = g.getBoundingClientRect(); confetti(rc.left+rc.width/2, rc.top); }
      draw();
    };
    const a = document.getElementById("again"); if(a) a.onclick = ()=>{ queue.push(queue.shift()); flipped=false; anim="slide"; draw(); };
  }
  draw();
}

/* ---------- exam questions ---------- */
function renderExam(panel, n, T){
  const total = T.exam.reduce((s,q)=>s+q.marks,0);
  const best = () => T.exam.reduce((s,q)=>s+Math.min(q.marks,S.exam[q.id]||0),0);
  panel.innerHTML = `
  <div class="eq-total"><span>Write your answer, open the mark scheme, then tick every point you made.</span><span class="score" id="tot">${best()} / ${total}</span></div>
  <div class="eq-list">${T.exam.map((q,k)=>`
    <div class="eq" data-q="${q.id}">
      <div class="eq-top"><span class="code">Question ${k+1} · ${q.ref}${q.sup?" · Supplement":""}</span><span class="marks" aria-label="${q.marks} mark${q.marks>1?"s":""}">[${q.marks}]</span></div>
      <div class="qt">${esc(q.q)}</div>
      <label for="ans-${q.id}" style="font-size:14px;font-weight:600;color:var(--ink2)">Your answer</label>
      <textarea id="ans-${q.id}" placeholder="Write it like you would in the exam"></textarea>
      <div class="row"><button class="btn quiet" data-show="${q.id}">Show mark scheme</button></div>
      <div class="ms" id="ms-${q.id}" hidden>
        <b>Mark scheme</b>
        ${q.ms.map((m,j)=>`<label><input type="checkbox" id="ms-${q.id}-${j}" data-ms="${q.id}"> <span>${esc(m)}</span></label>`).join("")}
        ${q.note?`<span class="note">${esc(q.note)}</span>`:""}
        <span>You scored <span class="score" id="sc-${q.id}">0 / ${q.marks}</span></span>
      </div>
    </div>`).join("")}</div>`;
  panel.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{ document.getElementById("ms-"+b.dataset.show).hidden=false; b.parentElement.hidden=true; });
  panel.querySelectorAll("[data-ms]").forEach(c=>c.onchange=()=>{
    const q = T.exam.find(x=>x.id===c.dataset.ms);
    const ticked = panel.querySelectorAll(`[data-ms="${q.id}"]:checked`).length;
    const sc = Math.min(q.marks, ticked);
    document.getElementById("sc-"+q.id).textContent = `${sc} / ${q.marks}`;
    const prev = S.exam[q.id]||0;
    if(sc > prev){ S.exam[q.id] = sc; save(); earn(null, 3*(sc-prev), "for exam marks"); if(sc===q.marks){ const rc=c.getBoundingClientRect(); confetti(rc.left, rc.top); } }
    document.getElementById("tot").textContent = `${best()} / ${total}`;
  });
}

      <div class="you"><div class="hearts" id="hearts"></div><span id="streak"></span></div>
    </div>
    <div class="fq" id="fq"></div></div>`;
  const $ = id => document.getElementById(id);
  function status(){
    $("hearts").innerHTML = [0,1,2].map(k=>heart(k<F.hearts)).join("");
    $("hearts").setAttribute("aria-label", `${F.hearts} hearts left`);
    $("streak").textContent = F.streak>1 ? `Streak ${F.streak}` : "";
    const hp = Math.max(0,F.hp);
    $("hpb").style.width = hp+"%"; $("hpn").textContent = `${hp} / 100`;
    $("hpb").parentElement.setAttribute("aria-valuenow", hp);
  }
  function ask(){
    if(!F.queue.length) F.queue = shuffle(b.qs);
    const q = F.cur = F.queue.shift(); F.asked++;
    let body;
    if(q.num!==undefined){
      body = `<form class="num" id="nf"><input id="nin" inputmode="decimal" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><span class="unit">${q.unit}</span><button class="btn">Attack</button></form>`;
    } else {
      F.opts = shuffle([q.a, ...q.w]);
      body = `<div class="opts">${F.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
    }
    $("fq").innerHTML = `<p class="qt">${esc(q.q)}</p>${body}
      ${q.num===undefined ? `<button class="link-btn" id="fifty" ${F.fifty?"":"disabled"}>${F.fifty?"Use 50/50 (once per fight)":"50/50 used"}</button>` : ""}`;
    if(q.num!==undefined){
      $("nf").onsubmit = e=>{ e.preventDefault(); const v = $("nin").value.replace(/[,\s×x%]/g,""); if(v==="") return; answer(Math.abs(parseFloat(v)-q.num) < 1e-9 + 1e-6*q.num); };
      $("nin").focus({preventScroll:true});
    } else {
      $("fq").querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
        const pick = F.opts[+btn.dataset.k];
        $("fq").querySelectorAll(".opt").forEach((o,k)=>{ o.disabled=true; if(F.opts[k]===q.a) o.classList.add("right"); });
        if(pick!==q.a) btn.classList.add("wrong");
        answer(pick===q.a);
      });
      const f = $("fifty"); if(f && F.fifty) f.onclick = ()=>{
        F.fifty=false; f.disabled=true; f.textContent="50/50 used";
        shuffle(F.opts.map((o,k)=>o===q.a?-1:k).filter(k=>k>=0)).slice(0,2).forEach(k=>$("fq").querySelector(`[data-k="${k}"]`).classList.add("gone"));
      };
    }
  }
  function answer(ok){
    const q = F.cur, boss = $("boss");
    boss.classList.remove("hit","lunge"); void boss.offsetWidth;
    let verdict;
    if(ok){
      F.streak++; F.best=Math.max(F.best,F.streak); F.right++;
      const dmg = Math.min(32, 14 + (F.streak-1)*6);
      F.hp -= dmg; boss.classList.add("hit");
      const d = document.createElement("div"); d.className="dmg"; d.textContent = `${dmg} damage`; $("stage").appendChild(d); setTimeout(()=>d.remove(),1000);
      verdict = F.streak>1 ? `Streak of ${F.streak}! ${dmg} damage.` : `Hit! ${dmg} damage.`;
    } else {
      F.streak=0; F.hearts--; F.missed.push(q); F.queue.push(q); boss.classList.add("lunge");
      verdict = `Not quite. ${b.name} hits back.`;
    }
    status();
    $("fq").querySelectorAll("#nf input, #nf button, #fifty").forEach(e=>e.disabled=true);
    const end = F.hp<=0 || F.hearts<=0;
    const fb = document.createElement("div"); fb.className = "fb"+(ok?"":" bad");
    fb.innerHTML = `<span class="verdict">${verdict}</span>${ok?"":`<span>Answer: <strong>${esc(q.num!==undefined? q.num+" "+q.unit : q.a)}</strong></span>`}<span>${esc(q.t)}</span>
      <div class="row"><button class="btn" id="next">${end?"See results":"Next question"}</button></div>`;
    $("fq").appendChild(fb);
    $("next").focus({preventScroll:true}); fb.scrollIntoView({behavior:REDUCED?"auto":"smooth", block:"nearest"});
    $("next").onclick = ()=> end ? result(F.hp<=0) : ask();
  }
  function result(won){
    if(won){ S.boss[n]=true; save(); }
    const acc = Math.round(100*F.right/Math.max(1,F.asked));
    const missed = [...new Set(F.missed)];
    panel.innerHTML = `<div class="fight">
      <div class="arena"><div class="hp-row"><b>${won?`${esc(b.name)} is beaten!`:`${esc(b.name)} won this time`}</b></div>
      <div class="stats"><div class="stat"><b>${acc}%</b><span>Accuracy</span></div><div class="stat"><b>${F.best}</b><span>Best streak</span></div><div class="stat"><b>${F.right}</b><span>Correct</span></div></div></div>
      ${missed.length ? `<h2 class="h2" style="margin:8px 0 0">Go back over these</h2><ul class="eq-list" style="list-style:none;padding:0;margin:0">${missed.map(q=>`<li class="eq"><span class="qt" style="font-size:17px">${esc(q.q)}</span><span>${esc(q.t)}</span></li>`).join("")}</ul>` : `<p style="margin:0">No mistakes. Try the exam questions next to practise writing full answers.</p>`}
      <div class="row"><button class="btn" id="again">Fight again</button><button class="btn quiet" id="notes">Back to notes</button></div></div>`;
    document.getElementById("again").onclick = ()=>fight(panel, n, T);
    document.getElementById("notes").onclick = ()=>go({view:"topic", topic:n, tab:"notes"});
    if(won){ confetti(innerWidth/2, innerHeight*0.35); earn(`boss-${n}-${dayKey(new Date())}`, 25, `for beating ${b.name}`); }
  }
  status(); ask();
}

route = fromHash();
render();
</script>
