<title>Specpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Kalam:wght@700&display=swap">
<style>
:root{
  --bg:#F3F4EF;
  --surface:#FFFFFF;
  --ink:#15181C;
  --ink2:#4A525A;
  --ink3:#6A727A;
  --rule:#D8DDDF;
  --accent:#17804A;
  --accent-ink:#FFFFFF;
  --accent-soft:#DFF1E6;
  --hl:#FFDC5E;
  --red:#B42318;
  --red-soft:#FCE9E6;
  --focus:#1C5FD4;
  --flame:#F2760E;
  /* diagram colours */
  --cyto:#FCE8EE; --memb:#C2456B; --nuc:#9A7FE0; --nuc2:#6A4DC0; --wall:#7FA33A; --chl:#2E9E4F;
  --vac:#CBE6F6; --vac2:#7DB5D8; --mito:#E8892E; --ribo:#3E454C; --dna:#2F6FDE; --rbc:#D2453F;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --hand:"Kalam", "Comic Sans MS", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1214; --surface:#171B1E; --ink:#E9ECEE; --ink2:#AFB6BC; --ink3:#8D959C; --rule:#2B3136;
    --accent:#5CC68D; --accent-ink:#0B1A11; --accent-soft:#143021; --hl:rgba(255,210,70,.38);
    --red:#FF8B7E; --red-soft:#3A1B18; --focus:#7FB0FF; --flame:#FF9A3D;
    --cyto:#3A2630; --memb:#F08AA8; --nuc:#8F78D6; --nuc2:#C2B2F7; --wall:#9FC45A; --chl:#5CC68D;
    --vac:#1D3A4D; --vac2:#5A9CC4; --mito:#F2A65A; --ribo:#C9CFD4; --dna:#7FB0FF; --rbc:#F07068;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1214; --surface:#171B1E; --ink:#E9ECEE; --ink2:#AFB6BC; --ink3:#8D959C; --rule:#2B3136;
  --accent:#5CC68D; --accent-ink:#0B1A11; --accent-soft:#143021; --hl:rgba(255,210,70,.38);
  --red:#FF8B7E; --red-soft:#3A1B18; --focus:#7FB0FF; --flame:#FF9A3D;
  --cyto:#3A2630; --memb:#F08AA8; --nuc:#8F78D6; --nuc2:#C2B2F7; --wall:#9FC45A; --chl:#5CC68D;
  --vac:#1D3A4D; --vac2:#5A9CC4; --mito:#F2A65A; --ribo:#C9CFD4; --dna:#7FB0FF; --rbc:#F07068;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1080px;margin:0 auto;padding:0 16px;min-height:58px;display:flex;align-items:center;gap:14px}
.mark{border:0;background:none;padding:8px 0;min-height:44px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mark .dot{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.mark .dot i{width:9px;height:9px;border-radius:50%;background:var(--hl)}
.crumbs{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink3);min-width:0;overflow:hidden;white-space:nowrap;flex:1}
.crumbs button{border:0;background:none;padding:10px 2px;min-height:44px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.crumbs span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.crumbs > *{display:none}.crumbs .parent{display:block}.crumbs .parent::before{content:"‹ "}}
.pill{display:flex;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.pill .streak{display:flex;align-items:center;gap:3px;color:var(--flame)}
.pill .xp{color:var(--ink2);font-weight:600}
@media (max-width:420px){.pill .xp{display:none}}
.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.35)}}

.page{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:26px 72px}

/* home */
.hello{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-bottom:30px}
@media (min-width:860px){.hello{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:end}}
.hello h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1;margin:0 0 10px;letter-spacing:-.03em}
.hello p{margin:0;color:var(--ink2);font-size:17px;max-width:52ch}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.today > div{padding:14px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.today > div + div{border-left:1px solid var(--rule)}
.today .lbl{font-size:13px;color:var(--ink3);font-weight:600}
.today .big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.today .big small{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink2)}
.today select{border:0;background:none;padding:0;min-height:44px;font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;max-width:100%}
.ring{width:34px;height:34px;transform:rotate(-90deg)}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-radius:16px;padding:18px 20px;margin-bottom:34px;background:var(--ink);color:var(--bg)}
.next small{display:block;font-size:14px;opacity:.75}
.next b{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.01em}
.next .btn{background:var(--hl);border-color:var(--hl);color:#15181C}
.h2{font-family:var(--display);font-size:26px;font-weight:800;margin:0 0 14px;letter-spacing:-.02em}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:18px 16px;margin:0;padding:0;list-style:none}
.book{position:relative;width:100%;aspect-ratio:3/4;border:0;border-radius:4px 12px 12px 4px;background:var(--c);color:#fff;padding:14px 12px 12px 22px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  box-shadow:inset 9px 0 0 rgba(0,0,0,.22), inset 11px 0 0 rgba(255,255,255,.18), 0 2px 0 rgba(0,0,0,.12);transition:transform .18s ease, box-shadow .18s ease}
.book:not(:disabled):hover{transform:translateY(-6px) rotate(-1.5deg);box-shadow:inset 9px 0 0 rgba(0,0,0,.22), inset 11px 0 0 rgba(255,255,255,.18), 0 12px 18px rgba(0,0,0,.18)}
.book:disabled{cursor:default;filter:saturate(.8);opacity:.92}
.label{background:#FFFEF8;color:#1C2024;border-radius:4px;padding:8px 9px 6px;display:flex;flex-direction:column;gap:2px;
  background-image:repeating-linear-gradient(transparent 0 21px,#D4DCE3 21px 22px);background-position:0 12px}
.label small{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6A727A;font-weight:700;line-height:1.2}
.label span{font-family:var(--hand);font-size:18px;line-height:1.2;color:#1F3B8A}
.book .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;font-size:13px;font-weight:700}
.book .foot .code{font-family:var(--mono);opacity:.9}
.sticker{background:#fff;color:#1C2024;border-radius:999px;padding:2px 8px;font-size:13px;transform:rotate(-4deg)}
.book .bar-p{height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:6px}
.book .bar-p i{display:block;height:100%;background:#fff}
.fine{font-size:14px;color:var(--ink3);margin-top:18px;max-width:62ch}

/* subject */
.band{background:var(--c,#17804A);color:#fff;border-radius:18px;padding:22px 22px 20px;margin-bottom:22px;position:relative;overflow:hidden}
.band .code{font-family:var(--mono);font-size:14px;opacity:.85}
.band h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,48px);line-height:1.02;margin:6px 0 8px;letter-spacing:-.03em;text-wrap:balance;max-width:18ch;position:relative}
.band p{margin:0;max-width:56ch;opacity:.92;position:relative}
.band .num{position:absolute;right:10px;bottom:-28px;font-family:var(--display);font-weight:800;font-size:170px;line-height:1;opacity:.16;pointer-events:none}
.toc{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.toc button{width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:12px;text-align:left;display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;min-height:56px;transition:transform .15s ease,border-color .15s ease}
.toc button:not(:disabled):hover{transform:translateX(4px);border-color:var(--accent)}
.toc .n{font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.toc .t{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.01em}
.toc .subs{display:block;font-family:var(--sans);font-size:14px;color:var(--ink2);font-weight:400;margin-top:2px;letter-spacing:0}
.toc button:disabled{cursor:default;background:transparent;border-style:dashed}
.toc button:disabled .t,.toc button:disabled .n{color:var(--ink3);font-weight:600}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.meter svg{width:30px;height:30px;transform:rotate(-90deg)}

/* topic */
.tabs{display:flex;gap:6px;margin-bottom:26px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:700;color:var(--ink2);white-space:nowrap;transition:background .15s ease}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .count{font-weight:600;opacity:.7;font-size:14px;margin-left:5px}

.notes-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
@media (min-width:900px){.notes-grid{grid-template-columns:210px minmax(0,1fr)}}
.side{font-size:15px}
@media (min-width:900px){.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start}}
.side h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px;font-weight:700}
.side ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;gap:10px;padding:10px 0;min-height:44px;align-items:center;color:var(--ink);text-decoration:none;font-weight:600}
.side a:hover{color:var(--accent)}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--rule);flex:none;display:grid;place-items:center;transition:background .2s ease,border-color .2s ease}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}

.notes{min-width:0;max-width:70ch;font-family:var(--serif);font-size:18px;line-height:1.7}
.notes section{padding-bottom:34px;margin-bottom:34px;border-bottom:2px dashed var(--rule);scroll-margin-top:90px}
.notes section:last-of-type{border-bottom:0}
.notes h2{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notes h2 .ref{font-family:var(--display);font-size:16px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:3px 9px;letter-spacing:0}
.notes h3{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.01em;margin:30px 0 8px}
.notes p{margin:0 0 14px}
.notes ul,.notes ol{margin:0 0 14px;padding-left:1.3em}
.notes li{margin-bottom:6px}
.kt{font-weight:600;padding:0 2px;background-image:linear-gradient(100deg,var(--hl) 0,var(--hl) 96%,transparent 100%);background-repeat:no-repeat;background-size:100% 44%;background-position:0 90%}
.kt.wait{background-size:0% 44%}
.kt.go{transition:background-size .8s cubic-bezier(.3,.8,.3,1)}
.sup{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.02em;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 7px;vertical-align:3px;white-space:nowrap}
.box{font-family:var(--sans);font-size:16px;line-height:1.55;border-radius:12px;padding:14px 16px 14px 52px;margin:18px 0;position:relative;background:var(--accent-soft)}
.box::before{content:"";position:absolute;left:16px;top:15px;width:24px;height:24px;border-radius:50%;background:var(--accent)}
.box::after{content:"!";position:absolute;left:16px;top:15px;width:24px;height:24px;display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-size:15px;line-height:1}
.box > b:first-child{display:block;font-family:var(--display);font-size:17px;margin-bottom:2px}
.box.tip > b:first-child{color:var(--accent)}
.box.trap{background:var(--red-soft)}
.box.trap::before{background:var(--red)}
.box.trap::after{content:"×";color:var(--surface)}
.box.trap > b:first-child{color:var(--red)}
.formula{font-family:var(--mono);font-size:17px;background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:16px;margin:16px 0;display:flex;flex-direction:column;gap:6px;overflow-x:auto;box-shadow:4px 4px 0 var(--hl)}
.work{font-family:var(--sans);font-size:16px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;margin:16px 0}
.work .q{font-family:var(--display);font-weight:800;font-size:17px;margin-bottom:8px}
.work ol{margin:0;padding-left:1.3em}
.flow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-family:var(--sans);font-size:15px;margin:10px 0 16px}
.flow span{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 12px;font-weight:700}
.flow span:nth-child(3){opacity:.9}.flow span:nth-child(5){opacity:.8}.flow span:nth-child(7){opacity:.7}.flow span:nth-child(9){opacity:.6}
.flow i{font-style:normal;color:var(--ink3);font-weight:700}
.tbl{overflow-x:auto;margin:16px 0;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:15px;line-height:1.45}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--accent-soft)}
.tbl th{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);font-weight:700;white-space:nowrap}
.tbl td.c{text-align:center;white-space:nowrap}
.yes{color:var(--accent);font-weight:800}
.no{color:var(--ink3)}
.done-row{font-family:var(--sans);font-size:16px;margin-top:12px}
.check{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* widgets */
.widget{font-family:var(--sans);font-size:16px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin:16px 0;display:flex;flex-direction:column;gap:12px}
.widget .wt{font-family:var(--display);font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.widget .wt::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--hl);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:999px;min-height:44px;padding:8px 12px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cellsvg{width:100%;max-width:440px;height:auto;align-self:center;display:block}
.cellsvg [data-part]{cursor:pointer;transition:opacity .2s ease, filter .2s ease}
.cellsvg.picked [data-part]:not(.on){opacity:.35}
.cellsvg [data-part]:hover{filter:brightness(1.12)}
.cellsvg [data-part]:focus{outline:none}
.cellsvg [data-part]:focus-visible{filter:drop-shadow(0 0 3px var(--focus))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:8px 12px;min-height:44px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.chips button i{width:10px;height:10px;border-radius:50%;flex:none}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.info{border-radius:12px;background:var(--bg);padding:12px 14px;min-height:74px}
.info b{font-family:var(--display);font-size:18px;display:block}
.info .in{font-size:14px;color:var(--ink3);margin-top:2px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--ink2)}
.fields input{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-height:48px;background:var(--bg);font-family:var(--mono);font-size:17px;width:100%}
.answer-big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em}
.steps{font-family:var(--mono);font-size:15px;color:var(--ink2);display:flex;flex-direction:column;gap:2px;overflow-x:auto}
.range{width:100%;height:44px;accent-color:var(--accent);cursor:pointer}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);font-weight:600}
.osmo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.osmo figure{margin:0;background:var(--bg);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.osmo svg{width:100%;height:auto;max-width:220px}
.osmo figcaption{font-size:14px;font-weight:700;text-align:center}
.osmo figcaption span{display:block;font-weight:600;color:var(--accent)}
.state{border-radius:12px;padding:12px 14px;background:var(--accent-soft);font-weight:600}
.qc{font-family:var(--sans);font-size:16px;border:2px solid var(--ink);border-radius:16px;padding:16px;margin:22px 0 6px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.qc .tag{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.qc .qt{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.3}

/* buttons */
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 18px;min-height:46px;font-weight:800;transition:transform .1s ease, box-shadow .15s ease}
.btn:hover:not(:disabled){box-shadow:0 4px 0 rgba(0,0,0,.18);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn.quiet{background:var(--surface);color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* flashcards */
.deck{max-width:620px;display:flex;flex-direction:column;gap:14px}
.deck-meta{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--rule)}
.dots i.on{background:var(--accent)}
.card{min-height:250px;border:0;background:var(--surface);border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:left;width:100%;box-shadow:0 1px 0 var(--rule), 0 10px 0 -4px var(--rule), 0 20px 0 -8px var(--rule);position:relative}
.card.flip{animation:flip .38s cubic-bezier(.3,.8,.3,1)}
@keyframes flip{from{transform:perspective(900px) rotateY(-80deg);opacity:.4}to{transform:none;opacity:1}}
.card.slide{animation:slide .3s ease}
@keyframes slide{from{transform:translateY(18px) scale(.97);opacity:0}to{transform:none;opacity:1}}

const Y = '<span class="yes" aria-label="yes">Yes</span>', N = '<span class="no" aria-label="no">No</span>';

      {ref:"2.1", title:"Cell structure", check:{q:"Which structure do plant cells share with bacteria but NOT with animal cells?",a:"Cell wall",w:["Chloroplasts","Nucleus","Large permanent vacuole"],t:"Bacteria have a cell wall too, but it is not made of cellulose."}, html:`
<p>All living organisms are made of cells. <span class="kt">New cells are produced by division of existing cells.</span> Animal, plant and bacterial cells share some structures and differ in others, and the exam asks you to compare them.</p>

<h3>Explore the cells</h3>
<p>Tap any part of the cell to see what it does. Switch between the three cell types to compare them.</p>
<div data-widget="cellmap"></div>

<h3>Structures and what they do</h3>
<div class="tbl"><table>
<thead><tr><th>Structure</th><th>Function</th><th>Animal</th><th>Plant</th><th>Bacterium</th></tr></thead>
<tbody>
<tr><td>Cell membrane</td><td>Controls what enters and leaves the cell. It is partially permeable.</td><td class="c">${Y}</td><td class="c">${Y}</td><td class="c">${Y}</td></tr>
<tr><td>Cytoplasm</td><td>Where most chemical reactions in the cell take place.</td><td class="c">${Y}</td><td class="c">${Y}</td><td class="c">${Y}</td></tr>
<tr><td>Ribosomes</td><td>Protein synthesis.</td><td class="c">${Y}</td><td class="c">${Y}</td><td class="c">${Y}</td></tr>
<tr><td>Nucleus</td><td>Contains the genetic material (chromosomes) that controls the cell.</td><td class="c">${Y}</td><td class="c">${Y}</td><td class="c">${N}</td></tr>
<tr><td>Mitochondria</td><td>Aerobic respiration, which releases energy.</td><td class="c">${Y}</td><td class="c">${Y}</td><td class="c">${N}</td></tr>
<tr><td>Cell wall</td><td>Strengthens the cell and keeps its shape. Made of cellulose in plants.</td><td class="c">${N}</td><td class="c">${Y}</td><td class="c">${Y}</td></tr>
<tr><td>Chloroplasts</td><td>Absorb light energy for photosynthesis.</td><td class="c">${N}</td><td class="c">${Y}</td><td class="c">${N}</td></tr>
<tr><td>Large permanent vacuole</td><td>Contains cell sap. Helps keep the cell firm.</td><td class="c">${N}</td><td class="c">${Y}</td><td class="c">${N}</td></tr>
<tr><td>Circular DNA and plasmids</td><td>Genetic material of a bacterium.</td><td class="c">${N}</td><td class="c">${N}</td><td class="c">${Y}</td></tr>
</tbody></table></div>

<div class="box tip"><b>Examiner tip</b>Plant cells have three structures that animal cells lack: a <strong>cell wall</strong>, <strong>chloroplasts</strong> and a <strong>large permanent vacuole</strong>. When a question asks you to compare them, name all three. Bacteria have a cell wall too, but it is not made of cellulose.</div>
<div class="box trap"><b>Common mistake</b>Saying the cell wall controls what enters the cell. The cell wall is fully permeable. Only the <strong>cell membrane</strong> controls entry and exit.</div>

<h3>Specialised cells</h3>
<p>Cells become <span class="kt">specialised</span> so they can carry out one job well. Learn the function of each cell below and one way its structure helps.</p>
<div class="tbl"><table>
<thead><tr><th>Cell</th><th>Function</th><th>How it is adapted</th></tr></thead>
<tbody>
<tr><td>Ciliated cell</td><td>Moves mucus in the trachea and bronchi</td><td>Cilia beat to sweep mucus, with trapped dust and pathogens, away from the lungs</td></tr>
<tr><td>Root hair cell</td><td>Absorbs water and mineral ions</td><td>Long extension gives a large surface area</td></tr>
<tr><td>Palisade mesophyll cell</td><td>Photosynthesis</td><td>Packed with chloroplasts</td></tr>
<tr><td>Neurone</td><td>Conducts electrical impulses</td><td>Long fibre carries impulses over long distances</td></tr>
<tr><td>Red blood cell</td><td>Transports oxygen</td><td>Contains haemoglobin and has no nucleus, leaving more room for it</td></tr>
<tr><td>Sperm and egg cells</td><td>Reproduction</td><td>Sperm have a flagellum to swim. Egg cells have a large food store in the cytoplasm</td></tr>
</tbody></table></div>

<h3>Levels of organisation</h3>
<div class="flow" aria-label="Cell, then tissue, then organ, then organ system, then organism"><span>Cell</span><i>→</i><span>Tissue</span><i>→</i><span>Organ</span><i>→</i><span>Organ system</span><i>→</i><span>Organism</span></div>
<ul>
<li><span class="kt">Tissue</span>: a group of cells with similar structures, working together to perform a shared function. Example: muscle tissue.</li>
<li><span class="kt">Organ</span>: a structure made of a group of tissues, working together to perform specific functions. Example: the heart.</li>
<li><span class="kt">Organ system</span>: a group of organs with related functions, working together to perform body functions. Example: the circulatory system.</li>
</ul>`},
      {ref:"2.2", title:"Size of specimens", check:{q:"An image is 20 mm long. The real object is 0.5 mm long. What is the magnification?",a:"×40",w:["×10","×0.025","×100"],t:"Image size ÷ actual size: 20 ÷ 0.5 = ×40."}, html:`
<p>Microscopes make cells look bigger. To work out how much bigger, you use the magnification formula. This is one of the most reliable calculation marks on Paper 4.</p>
<div class="formula" aria-label="Magnification formula">
<span>magnification = image size ÷ actual size</span>
<span>actual size = image size ÷ magnification</span>
<span>image size = actual size × magnification</span>
</div>
<p>Magnification has <span class="kt">no units</span>. Write it with a times sign, for example <strong>×400</strong>.</p>

<h3>Millimetres and micrometres ${SUP}</h3>
<p>Cells are tiny, so their actual size is often given in micrometres (µm).</p>
<div class="formula"><span>1 mm = 1000 µm</span><span>mm to µm: multiply by 1000</span><span>µm to mm: divide by 1000</span></div>
<p>Before you divide, <span class="kt">both sizes must be in the same unit</span>.</p>

<div class="work">
<div class="q">Worked example 1</div>
<p style="margin:0 0 8px">A drawing of a cheek cell is 45 mm wide. The real cell is 60 µm wide. Calculate the magnification.</p>
<ol><li>Convert to the same unit: 60 µm ÷ 1000 = 0.06 mm</li><li>Image size ÷ actual size: 45 ÷ 0.06 = 750</li><li>Answer: <strong>×750</strong></li></ol>
</div>
<div class="work">
<div class="q">Worked example 2</div>
<p style="margin:0 0 8px">An image of a cell is 30 mm long at ×400. Find its actual length in µm.</p>
<ol><li>Actual size = 30 ÷ 400 = 0.075 mm</li><li>Convert: 0.075 × 1000 = <strong>75 µm</strong></li></ol>
</div>
<div data-widget="magcalc"></div>
<div class="box tip"><b>Examiner tip</b>Measure image sizes with a ruler in millimetres, and check what unit the question wants your answer in.</div>
<div class="box trap"><b>Common mistake</b>Dividing actual size by image size. The image is the big number, so it goes on top. If your magnification is less than 1, you have it upside down.</div>`}
    ],

      ["What is the function of ribosomes?","Protein synthesis."],

      ["What do bacteria have instead of a nucleus?","A single circular chromosome (circular DNA) and small rings of DNA called plasmids."],

      {id:"t2q6",ref:"2.2",marks:3,sup:true,q:"An image of a mitochondrion is 12 mm long at a magnification of ×8000. Calculate its actual length in µm. Show your working.",ms:["12 ÷ 8000 = 0.0015 mm","Multiplies by 1000 to convert to µm","1.5 µm"]}
    ],
    boss:{name:"Membrano", color:"#3FA66E", dark:"#1D5E3B", shape:"cell", qs:[
      {q:"Which structure is found in plant cells but NOT in animal cells?",a:"Cell wall",w:["Cell membrane","Ribosome","Nucleus"],t:"Cell wall, chloroplasts and a large permanent vacuole are the plant only structures here."},
      {q:"Where in the cell does aerobic respiration take place?",a:"Mitochondria",w:["Ribosomes","Nucleus","Chloroplasts"],t:"Mitochondria release energy by aerobic respiration."},
      {q:"Which part controls what enters and leaves the cell?",a:"Cell membrane",w:["Cell wall","Cytoplasm","Vacuole"],t:"The cell wall is fully permeable. Only the membrane controls entry."},

      {q:"A drawing is 40 mm long. The real cell is 0.1 mm long. What is the magnification?",num:400,unit:"×",t:"40 ÷ 0.1 = ×400."},

      {q:"An image is 15 mm long at ×300. What is the actual size in µm?",num:50,unit:"µm",t:"15 ÷ 300 = 0.05 mm, then × 1000 = 50 µm."},

  },
  3: {
    subs: [
      {ref:"3.1", title:"Diffusion", check:{q:"Which change would SLOW diffusion down?",a:"A longer diffusion distance",w:["A higher temperature","A larger surface area","A steeper concentration gradient"],t:"Particles have further to travel, so diffusion takes longer."}, html:`
<p><span class="kt">Diffusion</span> is the net movement of particles from a region of higher concentration to a region of lower concentration, down a concentration gradient, as a result of their random movement.</p>
<p>The energy for diffusion comes from the <span class="kt">kinetic energy of random movement</span> of molecules and ions. The cell does not use energy from respiration, so diffusion is a passive process.</p>
<p>Substances move into and out of cells by diffusion through the cell membrane. Examples include oxygen and carbon dioxide during gas exchange, and dissolved substances (solutes) moving between cells and the fluid around them.</p>

<h3>What changes the rate of diffusion</h3>
<div class="tbl"><table>
<thead><tr><th>Factor</th><th>Faster diffusion when…</th><th>Why</th></tr></thead>
<tbody>
<tr><td>Surface area</td><td>Larger</td><td>More space for particles to cross at once</td></tr>
<tr><td>Temperature</td><td>Higher</td><td>Particles have more kinetic energy and move faster</td></tr>
<tr><td>Concentration gradient</td><td>Steeper</td><td>Bigger difference means more net movement</td></tr>
<tr><td>Distance</td><td>Shorter</td><td>Particles have less far to travel</td></tr>
</tbody></table></div>
<div class="box tip"><b>Examiner tip</b>Always write <strong>net movement</strong> in your definition. Particles move both ways, but more move from high to low concentration.</div>`},
      {ref:"3.2", title:"Osmosis", check:{q:"Which word describes a plant cell full of water, pressing on its cell wall?",a:"Turgid",w:["Flaccid","Plasmolysed","Burst"],t:"Turgid cells push outwards on the wall. That turgor pressure supports the plant."}, html:`
<p>Water diffuses through partially permeable membranes by <span class="kt">osmosis</span>. Water moves into and out of cells by osmosis through the cell membrane.</p>
<p>${SUP} The full definition: osmosis is the net movement of water molecules from a region of <span class="kt">higher water potential</span> (a dilute solution) to a region of <span class="kt">lower water potential</span> (a concentrated solution), through a partially permeable membrane.</p>

<h3>Plant cells ${SUP}</h3>
<ul>
<li>In a dilute solution, water enters by osmosis. The cell becomes <span class="kt">turgid</span>. Water pushing outwards on the cell wall creates <span class="kt">turgor pressure</span>, which supports the plant.</li>
<li>In a concentrated solution, water leaves by osmosis. The cell becomes <span class="kt">flaccid</span>. If it loses a lot of water, the membrane pulls away from the cell wall. This is <span class="kt">plasmolysis</span>.</li>
<li>A plant wilts when its cells become flaccid and lose turgor pressure.</li>
</ul>
<h3>Animal cells ${SUP}</h3>
<p>Animal cells have no cell wall. In a dilute solution they gain water and can <span class="kt">burst</span>. In a concentrated solution they lose water and <span class="kt">shrink</span>. This is why the water potential of blood plasma must be kept steady.</p>

<h3>See it happen</h3>
<div data-widget="osmosis"></div>

<h3>The potato practical</h3>
<p>Cylinders of potato are weighed, left in sucrose solutions of different concentrations, then blotted dry and weighed again.</p>
<div class="formula"><span>percentage change = (change in mass ÷ starting mass) × 100</span></div>
<p>A gain in mass means water entered. A loss means water left. Where the mass does not change, the water potential of the potato equals that of the solution.</p>
<div class="box trap"><b>Common mistake</b>Saying "water moves from high concentration to low concentration". That describes the solute, not water. Talk about <strong>water potential</strong>, or about moving from a dilute to a concentrated solution.</div>`},
      {ref:"3.3", title:"Active transport", check:{q:"Why do cells that carry out lots of active transport have many mitochondria?",a:"To release more energy from respiration",w:["To make more protein carriers","To store water","To absorb light"],t:"Active transport needs energy from respiration, and respiration happens in mitochondria."}, html:`
<p><span class="kt">Active transport</span> is the movement of particles through a cell membrane from a region of lower concentration to a region of higher concentration, using energy from respiration. It moves substances <strong>against</strong> a concentration gradient.</p>
<p>Example: root hair cells take in mineral ions from the soil by active transport, because the soil has a lower concentration of ions than the cell.</p>
<p>${SUP} <span class="kt">Protein carriers</span> in the membrane move the molecules or ions across during active transport.</p>

<h3>Comparing the three processes</h3>
<div class="tbl"><table>
<thead><tr><th></th><th>Diffusion</th><th>Osmosis</th><th>Active transport</th></tr></thead>
<tbody>
<tr><td>What moves</td><td>Any particles</td><td>Water only</td><td>Molecules or ions</td></tr>
<tr><td>Direction</td><td>Down the gradient</td><td>Higher to lower water potential</td><td>Against the gradient</td></tr>

const COVERS = {bio:"#17804A", chem:"#DD6420", phys:"#2A64CF", math:"#C9302C", eng:"#6A42B8", lit:"#A8336F", dt:"#2E343B", econ:"#0C7F7F", gp:"#2E8FBF", spa:"#C78A00"};

/* ================= STORAGE ================= */
let S = {revised:{}, cards:{}, exam:{}, boss:{}, last:null, xp:0, days:{}, earned:{}, examYear:2028};
try{ const s = JSON.parse(localStorage.getItem("specpoint")||"null"); if(s) S = Object.assign(S, s); }catch(e){}
function save(){ try{ localStorage.setItem("specpoint", JSON.stringify(S)); }catch(e){} }

const GOAL = 30;
const dayKey = d => d.toLocaleDateString("en-CA");
const todayXP = () => S.days[dayKey(new Date())] || 0;
function streak(){
  const d = new Date(); if(!S.days[dayKey(d)]) d.setDate(d.getDate()-1);
  let c = 0; while(S.days[dayKey(d)] > 0){ c++; d.setDate(d.getDate()-1); }
  return c;
}
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* award XP once per key (key null = always) */
function earn(key, n, label){
  if(key){ if(S.earned[key]) return; S.earned[key] = 1; }
  const before = todayXP();
  S.xp += n; S.days[dayKey(new Date())] = before + n; save();
  toast(`<b>+${n} XP</b> ${label||""}`);
  drawPill(true);
  if(before < GOAL && before + n >= GOAL){ setTimeout(()=>{ toast(`Daily goal done. <b>Streak ${streak()}</b>`); confetti(innerWidth/2, innerHeight*0.4); }, 900); }
}
function toast(html){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.innerHTML = html;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 1900);
}
function confetti(x, y){
  if(REDUCED) return;
  const cols = ["#FFDC5E","#17804A","#F0506E","#2A64CF","#F2760E","#5CC68D"];
  for(let i=0;i<26;i++){
    const c = document.createElement("i"); c.className = "confetti";
    const a = Math.random()*Math.PI*2, r = 80 + Math.random()*160;
    c.style.cssText = `left:${x}px;top:${y}px;background:${cols[i%cols.length]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r + 120}px;--r:${Math.random()*720-360}deg`;
    document.body.appendChild(c); setTimeout(()=>c.remove(), 1200);
  }
}
const FLAME = `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z" fill="currentColor"/></svg>`;
function drawPill(bump){
  const p = document.getElementById("pill");
  p.innerHTML = `<span class="streak ${bump?"pop":""}" title="Days in a row">${FLAME}${streak()}</span><span class="xp ${bump?"pop":""}">${S.xp} XP</span>`;
  p.setAttribute("aria-label", `${streak()} day streak, ${S.xp} XP`);
}
function ring(frac, size=34, stroke=5, col="var(--accent)"){
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--rule)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*Math.min(1,frac)} ${c}"/></svg>`;
}

/* ================= HELPERS ================= */
const app = document.getElementById("app");

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function topicProgress(n){
  const t = TOPICS[n]; if(!t) return 0;
  const parts = t.subs.length*3 + t.cards.length + t.exam.reduce((s,q)=>s+q.marks,0) + 3;
  let got = t.subs.filter(s=>S.revised[s.ref]).length*3;
  got += t.cards.filter((c,i)=>S.cards[`${n}-${i}`]).length;
  got += t.exam.reduce((s,q)=>s+Math.min(q.marks, S.exam[q.id]||0),0);
  if(S.boss[n]) got += 3;
  return Math.round(100*got/parts);
}
function subjectProgress(){ const ks = Object.keys(TOPICS); return Math.round(ks.reduce((s,k)=>s+topicProgress(+k),0)/BIO_TOPICS.length); }

function upNext(){
  for(const n of Object.keys(TOPICS).map(Number)){
    const T = TOPICS[n];
    const sub = T.subs.find(s=>!S.revised[s.ref]);
    if(sub) return {lbl:`Read ${sub.ref} ${sub.title}`, sub:`Biology, Topic ${n}`, r:{view:"topic", topic:n, tab:"notes"}};
    const left = T.cards.filter((c,i)=>!S.cards[`${n}-${i}`]).length;
    if(left) return {lbl:`${left} flashcards to learn`, sub:`Biology, Topic ${n}`, r:{view:"topic", topic:n, tab:"cards"}};
    if(!S.boss[n]) return {lbl:`Beat ${T.boss.name}`, sub:`Biology, Topic ${n} boss`, r:{view:"topic", topic:n, tab:"fight"}};
  }
  return {lbl:"Try the exam questions again", sub:"Biology, Topic 2", r:{view:"topic", topic:2, tab:"exam"}};
}

  render(); window.scrollTo(0,0);
}
function toHash(r){ return r.view==="home" ? "home" : r.view==="subject" ? "bio" : `bio-${r.topic}-${r.tab||"notes"}`; }
function fromHash(){
  const h = (location.hash||"").slice(1);
  const m = h.match(/^bio-(\d+)-(notes|cards|exam|fight)$/);
  if(m && TOPICS[+m[1]]) return {view:"topic", topic:+m[1], tab:m[2]};
  if(h==="bio") return {view:"subject"};
  return {view:"home"};
}
window.addEventListener("popstate", ()=>go(fromHash(), false));

}

/* ---------- quick check ---------- */
function quickCheck(el, q, key){
  const opts = shuffle([q.a, ...q.w]);
  el.innerHTML = `<span class="tag">Quick check</span><p class="qt">${esc(q.q)}</p><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div class="qc-fb"></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const pick = opts[+b.dataset.k], ok = pick===q.a;
    el.querySelectorAll(".opt").forEach((o,k)=>{ o.disabled = true; if(opts[k]===q.a) o.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    el.querySelector(".qc-fb").innerHTML = `<div class="fb ${ok?"":"bad"}"><span class="verdict">${ok?"Nice.":"Not quite."}</span><span>${esc(q.t)}</span>${ok?"":`<button class="link-btn" data-retry>Try again</button>`}</div>`;
    const r = el.querySelector("[data-retry]"); if(r) r.onclick = ()=>quickCheck(el, q, key);
    if(ok){ const rc = b.getBoundingClientRect(); confetti(rc.left+rc.width/2, rc.top); earn(key, 5, "quick check"); }
  });
}

    const r = el.querySelector("#os-r");
    const arrows = (dir, show)=> !show ? "" : [[16,75],[184,75]].map(([x,y],i)=>{
      const pointIn = dir==="in"; const flip = (i===0) === pointIn ? 1 : -1;
      return `<g transform="translate(${x} ${y}) scale(${flip} 1)"><path d="M-10 0 h16 M0 -6 l7 6 l-7 6" stroke="var(--dna)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    }).join("");
    const upd = ()=>{
      const v = +r.value;
      const dir = v<40 ? "in" : v>60 ? "out" : "none";
      const s = v<=40 ? 1 : v<=60 ? 0.97 : Math.max(0.6, 0.97 - (v-60)/40*0.4);
      const w = 124*s, h = 94*s, x = 100 - w/2, y = 75 - h/2;
      const vs = v<=40 ? 1 : Math.max(0.35, 1 - (v-40)/60*0.75);
      const plantState = v<40 ? "Turgid" : v<=60 ? "No change" : v<=80 ? "Flaccid" : "Plasmolysed";
      document.getElementById("os-p").innerHTML = `<svg viewBox="0 0 200 150" aria-hidden="true">
        <rect x="32" y="22" width="136" height="106" rx="8" fill="none" stroke="var(--wall)" stroke-width="7"/>

        <rect x="${100-38*vs}" y="${75-26*vs}" width="${76*vs}" height="${52*vs}" rx="${16*vs}" fill="var(--vac)" stroke="var(--vac2)" stroke-width="2" style="transition:all .25s ease"/>
        ${arrows(dir, dir!=="none")}</svg><figcaption>Plant cell<span>${plantState}</span></figcaption>`;
      const rad = v<15 ? 52 : v<40 ? 46 : v<=60 ? 40 : Math.max(26, 40 - (v-60)/40*14);
      const burst = v<15;
      const aState = burst ? "Bursts" : v<40 ? "Swells" : v<=60 ? "No change" : "Shrinks";
      const pts = []; const spikes = v>70 ? 14 : 0;
      for(let k=0;k<56;k++){ const a = k/56*Math.PI*2; const rr = rad + (spikes && k%4===0 ? 5 : 0); pts.push(`${(100+Math.cos(a)*rr).toFixed(1)},${(75+Math.sin(a)*rr).toFixed(1)}`); }
      document.getElementById("os-a").innerHTML = `<svg viewBox="0 0 200 150" aria-hidden="true">
        <polygon points="${pts.join(" ")}" fill="${burst?"none":"var(--rbc)"}" stroke="var(--rbc)" stroke-width="4" ${burst?'stroke-dasharray="10 9"':""} opacity="${burst?.8:1}"/>
        ${burst?"":`<ellipse cx="100" cy="75" rx="${rad*0.45}" ry="${rad*0.3}" fill="rgba(0,0,0,.14)"/>`}
        ${arrows(dir, dir!=="none")}</svg><figcaption>Red blood cell<span>${aState}</span></figcaption>`;
      document.getElementById("os-s").textContent =
        v<40 ? `Dilute solution. Water moves INTO the cells by osmosis. ${burst?"The red blood cell has no wall to stop it, so it bursts.":"The cell wall stops the plant cell bursting."}` :
        v<=60 ? "The solution has the same water potential as the cells. No net movement of water." :
        v<=80 ? "Concentrated solution. Water moves OUT of the cells by osmosis. The plant cell goes flaccid." :
        "Very concentrated. So much water leaves that the membrane pulls away from the cell wall. That is plasmolysis.";
    };
    r.oninput = upd; upd();
  }
};

/* ---------- flashcards ---------- */
function renderCards(panel, n, T){
  let queue = shuffle(T.cards.map((c,i)=>i).filter(i=>!S.cards[`${n}-${i}`]));
  let flipped = false, anim = "";
  function draw(){
    const known = T.cards.filter((c,i)=>S.cards[`${n}-${i}`]).length;
    if(!queue.length){
      panel.innerHTML = `<div class="deck"><div class="card back ${anim}"><span class="side-lbl">Deck complete</span><div class="face">You know all ${T.cards.length} cards in Topic ${n}.</div><div class="hint">Come back in a few days and reset the deck. Spacing out practice is what makes it stick.</div></div>
      <div class="row"><button class="btn" id="reset">Reset deck</button><button class="btn quiet" id="exam">Try exam questions</button></div></div>`;
      document.getElementById("reset").onclick = ()=>{ T.cards.forEach((c,i)=>delete S.cards[`${n}-${i}`]); save(); queue = shuffle(T.cards.map((c,i)=>i)); anim="slide"; draw(); };
      document.getElementById("exam").onclick = ()=>go({view:"topic", topic:n, tab:"exam"});
      return;
    }
    const i = queue[0], [front, back] = T.cards[i];
    panel.innerHTML = `<div class="deck">
      <div class="deck-meta"><span>${known} of ${T.cards.length} known</span><span class="dots" aria-hidden="true">${T.cards.map((c,k)=>`<i class="${S.cards[`${n}-${k}`]?"on":""}"></i>`).join("")}</span></div>
      <button class="card ${flipped?"back":""} ${anim}" id="card" aria-live="polite">
        <span class="side-lbl">${flipped?"Answer":"Question"}</span>
        <span class="face">${esc(flipped?back:front)}</span>
        ${flipped?"":`<span class="hint">Say the answer out loud, then tap to check.</span>`}
      </button>
      <div class="row">${flipped
        ? `<button class="btn quiet" id="again">Not yet</button><button class="btn" id="got">I knew it</button>`
        : `<button class="btn" id="flip">Show answer</button>`}</div></div>`;
    const flip = ()=>{ if(!flipped){ flipped = true; anim="flip"; draw(); } };
    document.getElementById("card").onclick = flip;
    const f = document.getElementById("flip"); if(f) f.onclick = flip;
    const g = document.getElementById("got"); if(g) g.onclick = ()=>{
      S.cards[`${n}-${i}`]=1; save(); queue.shift(); flipped=false; anim="slide";
      earn(`card-${n}-${i}`, 2, "card learned");
      if(!queue.length){ const rc = g.getBoundingClientRect(); confetti(rc.left+rc.width/2, rc.top); }
      draw();
    };
    const a = document.getElementById("again"); if(a) a.onclick = ()=>{ queue.push(queue.shift()); flipped=false; anim="slide"; draw(); };
  }
  draw();
}

function renderExam(panel, n, T){
  const total = T.exam.reduce((s,q)=>s+q.marks,0);
  const best = () => T.exam.reduce((s,q)=>s+Math.min(q.marks,S.exam[q.id]||0),0);
  panel.innerHTML = `
  <div class="eq-total"><span>Write your answer, open the mark scheme, then tick every point you made.</span><span class="score" id="tot">${best()} / ${total}</span></div>
  <div class="eq-list">${T.exam.map((q,k)=>`
    <div class="eq" data-q="${q.id}">
      <div class="eq-top"><span class="code">Question ${k+1} · ${q.ref}${q.sup?" · Supplement":""}</span><span class="marks">${q.marks} mark${q.marks>1?"s":""}</span></div>
      <div class="qt">${esc(q.q)}</div>
      <label for="ans-${q.id}" style="font-size:14px;font-weight:600;color:var(--ink2)">Your answer</label>
      <textarea id="ans-${q.id}" placeholder="Write it like you would in the exam"></textarea>
      <div class="row"><button class="btn quiet" data-show="${q.id}">Show mark scheme</button></div>
      <div class="ms" id="ms-${q.id}" hidden>
        <b>Mark scheme</b>
        ${q.ms.map((m,j)=>`<label><input type="checkbox" id="ms-${q.id}-${j}" data-ms="${q.id}"> <span>${esc(m)}</span></label>`).join("")}
        ${q.note?`<span class="note">${esc(q.note)}</span>`:""}
        <span>You scored <span class="score" id="sc-${q.id}">0 / ${q.marks}</span></span>
      </div>
    </div>`).join("")}</div>`;
  panel.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{ document.getElementById("ms-"+b.dataset.show).hidden=false; b.parentElement.hidden=true; });
  panel.querySelectorAll("[data-ms]").forEach(c=>c.onchange=()=>{
    const q = T.exam.find(x=>x.id===c.dataset.ms);
    const ticked = panel.querySelectorAll(`[data-ms="${q.id}"]:checked`).length;
    const sc = Math.min(q.marks, ticked);
    document.getElementById("sc-"+q.id).textContent = `${sc} / ${q.marks}`;
    const prev = S.exam[q.id]||0;
    if(sc > prev){ S.exam[q.id] = sc; save(); earn(null, 3*(sc-prev), "for exam marks"); if(sc===q.marks){ const rc=c.getBoundingClientRect(); confetti(rc.left, rc.top); } }
    document.getElementById("tot").textContent = `${best()} / ${total}`;
  });
}

function fight(panel, n, T){
  const b = T.boss;
  const F = {hp:100, hearts:3, streak:0, best:0, asked:0, right:0, queue:shuffle(b.qs), missed:[], fifty:true};
  panel.innerHTML = `<div class="fight">
    <div class="arena">
      <div class="hp-row"><b>${esc(b.name)}</b><span id="hpn">100 / 100</span></div>
      <div class="hp" role="progressbar" aria-label="Boss health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="hpb" style="width:100%"></i></div>
      <div class="stage" id="stage"><div class="boss" id="boss">${bossArt(b)}</div></div>
      <div class="you"><div class="hearts" id="hearts"></div><span id="streak"></span></div>
    </div>
    <div class="fq" id="fq"></div></div>`;
  const $ = id => document.getElementById(id);
  function status(){
    $("hearts").innerHTML = [0,1,2].map(k=>heart(k<F.hearts)).join("");
    $("hearts").setAttribute("aria-label", `${F.hearts} hearts left`);
    $("streak").textContent = F.streak>1 ? `Streak ${F.streak}` : "";
    const hp = Math.max(0,F.hp);
    $("hpb").style.width = hp+"%"; $("hpn").textContent = `${hp} / 100`;
    $("hpb").parentElement.setAttribute("aria-valuenow", hp);
  }
  function ask(){
    if(!F.queue.length) F.queue = shuffle(b.qs);
    const q = F.cur = F.queue.shift(); F.asked++;
    let body;
    if(q.num!==undefined){
      body = `<form class="num" id="nf"><input id="nin" inputmode="decimal" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><span class="unit">${q.unit}</span><button class="btn">Attack</button></form>`;
    } else {
      F.opts = shuffle([q.a, ...q.w]);
      body = `<div class="opts">${F.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
    }
    $("fq").innerHTML = `<p class="qt">${esc(q.q)}</p>${body}
      ${q.num===undefined ? `<button class="link-btn" id="fifty" ${F.fifty?"":"disabled"}>${F.fifty?"Use 50/50 (once per fight)":"50/50 used"}</button>` : ""}`;
    if(q.num!==undefined){
      $("nf").onsubmit = e=>{ e.preventDefault(); const v = $("nin").value.replace(/[,\s×x%]/g,""); if(v==="") return; answer(Math.abs(parseFloat(v)-q.num) < 1e-9 + 1e-6*q.num); };
      $("nin").focus({preventScroll:true});
    } else {
      $("fq").querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
        const pick = F.opts[+btn.dataset.k];
        $("fq").querySelectorAll(".opt").forEach((o,k)=>{ o.disabled=true; if(F.opts[k]===q.a) o.classList.add("right"); });
        if(pick!==q.a) btn.classList.add("wrong");
        answer(pick===q.a);
      });
      const f = $("fifty"); if(f && F.fifty) f.onclick = ()=>{
        F.fifty=false; f.disabled=true; f.textContent="50/50 used";
        shuffle(F.opts.map((o,k)=>o===q.a?-1:k).filter(k=>k>=0)).slice(0,2).forEach(k=>$("fq").querySelector(`[data-k="${k}"]`).classList.add("gone"));
      };
    }
  }
  function answer(ok){
    const q = F.cur, boss = $("boss");
    boss.classList.remove("hit","lunge"); void boss.offsetWidth;
    let verdict;
    if(ok){
      F.streak++; F.best=Math.max(F.best,F.streak); F.right++;
      const dmg = Math.min(32, 14 + (F.streak-1)*6);
      F.hp -= dmg; boss.classList.add("hit");
      const d = document.createElement("div"); d.className="dmg"; d.textContent = `${dmg} damage`; $("stage").appendChild(d); setTimeout(()=>d.remove(),1000);
      verdict = F.streak>1 ? `Streak of ${F.streak}! ${dmg} damage.` : `Hit! ${dmg} damage.`;
    } else {
      F.streak=0; F.hearts--; F.missed.push(q); F.queue.push(q); boss.classList.add("lunge");
      verdict = `Not quite. ${b.name} hits back.`;
    }
    status();
    $("fq").querySelectorAll("#nf input, #nf button, #fifty").forEach(e=>e.disabled=true);
    const end = F.hp<=0 || F.hearts<=0;
    const fb = document.createElement("div"); fb.className = "fb"+(ok?"":" bad");
    fb.innerHTML = `<span class="verdict">${verdict}</span>${ok?"":`<span>Answer: <strong>${esc(q.num!==undefined? q.num+" "+q.unit : q.a)}</strong></span>`}<span>${esc(q.t)}</span>
      <div class="row"><button class="btn" id="next">${end?"See results":"Next question"}</button></div>`;
    $("fq").appendChild(fb);
    $("next").focus({preventScroll:true}); fb.scrollIntoView({behavior:REDUCED?"auto":"smooth", block:"nearest"});
    $("next").onclick = ()=> end ? result(F.hp<=0) : ask();
  }
  function result(won){
    if(won){ S.boss[n]=true; save(); }
    const acc = Math.round(100*F.right/Math.max(1,F.asked));
    const missed = [...new Set(F.missed)];
    panel.innerHTML = `<div class="fight">
      <div class="arena"><div class="hp-row"><b>${won?`${esc(b.name)} is beaten!`:`${esc(b.name)} won this time`}</b></div>
      <div class="stats"><div class="stat"><b>${acc}%</b><span>Accuracy</span></div><div class="stat"><b>${F.best}</b><span>Best streak</span></div><div class="stat"><b>${F.right}</b><span>Correct</span></div></div></div>
      ${missed.length ? `<h2 class="h2" style="margin:8px 0 0">Go back over these</h2><ul class="eq-list" style="list-style:none;padding:0;margin:0">${missed.map(q=>`<li class="eq"><span class="qt" style="font-size:17px">${esc(q.q)}</span><span>${esc(q.t)}</span></li>`).join("")}</ul>` : `<p style="margin:0">No mistakes. Try the exam questions next to practise writing full answers.</p>`}
      <div class="row"><button class="btn" id="again">Fight again</button><button class="btn quiet" id="notes">Back to notes</button></div></div>`;
    document.getElementById("again").onclick = ()=>fight(panel, n, T);
    document.getElementById("notes").onclick = ()=>go({view:"topic", topic:n, tab:"notes"});
    if(won){ confetti(innerWidth/2, innerHeight*0.35); earn(`boss-${n}-${dayKey(new Date())}`, 25, `for beating ${b.name}`); }
  }
  status(); ask();
}

route = fromHash();
render();
</script>
