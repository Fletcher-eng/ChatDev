<title>Trade Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a header, three risk meters, one ticket per practice trade (chart on top, numbers and the fill form below),
   then the watch only list. Money is written in plain dollars with no sign, so a loss reads as "at risk". */
:root {
  --plane: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6c6a65;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);
  --price: #2a78d6;
  --good: #0ca30c;
  --bad: #d03b3b;
  --warn: #fab219;
  --good-wash: rgba(12, 163, 12, 0.12);
  --bad-wash: rgba(208, 59, 59, 0.12);
  --focus: #2a78d6;
  --shadow: rgba(0, 0, 0, 0.14);
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", "Barlow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9d9b94;
    --grid: #2c2c2a;
    --axis: #383835;
    --ring: rgba(255, 255, 255, 0.10);
    --price: #3987e5;
    --good-wash: rgba(12, 163, 12, 0.18);
    --bad-wash: rgba(208, 59, 59, 0.20);
    --focus: #6da7ec;
    --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plane: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #9d9b94;
  --grid: #2c2c2a;
  --axis: #383835;
  --ring: rgba(255, 255, 255, 0.10);
  --price: #3987e5;
  --good-wash: rgba(12, 163, 12, 0.18);
  --bad-wash: rgba(208, 59, 59, 0.20);
  --focus: #6da7ec;
  --shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--plane);
  color: var(--ink);
  font: 400 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 44px;
}
.wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 22px; }
h1, h2, p, ul, dl, dd { margin: 0; }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.eyebrow, .tile .k, .stats dt, .field label, h2 {
  font: 600 12px/1 var(--f-cond); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
h1 { font: 700 44px/1 var(--f-cond); letter-spacing: 0.01em; text-transform: uppercase; margin-top: 8px; }
.asof { color: var(--ink-2); max-width: 52ch; margin-top: 10px; text-wrap: balance; }
h2 { padding-bottom: 8px; border-bottom: 1px solid var(--grid); margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 12px/1 var(--f-cond); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 9px 5px; border-radius: 4px; border: 1px solid var(--ring); color: var(--ink); background: var(--surface);
}
.chip.paper { background: var(--ink); color: var(--surface); border-color: transparent; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.planned i { background: var(--price); }
.chip.filled i { background: var(--good); }
.chip.preview i { background: var(--warn); }
.chip.off i { background: var(--muted); }
.chip.bad i { background: var(--bad); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 14px 16px 16px; display: grid; gap: 7px; align-content: start; min-width: 0; }
.tile .v { font: 600 34px/1.05 var(--f-body); }
.tile .s { color: var(--ink-2); font-size: 13px; }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--grid); margin-top: 4px; }
.meter > i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--price); }
.meter > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.meter.over > i { background: var(--bad); }
.pips { display: flex; gap: 6px; margin-top: 4px; }
.pips span { width: 30px; height: 8px; border-radius: 4px; background: var(--grid); }
.pips span.on { background: var(--price); }

.howto { color: var(--ink-2); max-width: 78ch; text-wrap: pretty; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; align-items: start; }
.ticket { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.ticket.off { opacity: 0.6; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.head .chips { margin-left: auto; }
.tk { font: 700 32px/1 var(--f-cond); letter-spacing: 0.02em; }
.nm { color: var(--ink-2); }
.plan b { font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 22px; height: 8px; overflow: visible; }
.k-price { stroke: var(--price); stroke-width: 2; }
.k-avg { stroke: var(--muted); stroke-width: 1.5; }
.k-entry { stroke: var(--ink-2); stroke-width: 1.5; }
.k-stop { stroke: var(--bad); stroke-width: 1.5; }
.k-target { stroke: var(--good); stroke-width: 1.5; }
.chart { position: relative; min-width: 0; border-radius: 4px; touch-action: pan-y; }
.chart:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.chart svg { display: block; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.g { stroke: var(--grid); stroke-width: 1; }
.ax { stroke: var(--axis); stroke-width: 1; }
.tl, .xl { fill: var(--muted); font: 500 11px var(--f-body); }
.pr { fill: none; stroke: var(--price); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.avg { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; }
.dot { fill: var(--price); stroke: var(--surface); stroke-width: 2; }
.lv { stroke-width: 1.5; stroke-dasharray: 5 4; }
.lv.entry { stroke: var(--ink-2); }
.lv.stop { stroke: var(--bad); }
.lv.target { stroke: var(--good); }
.z-good { fill: var(--good-wash); }
.z-bad { fill: var(--bad-wash); }
.m-target { fill: var(--good); }
.m-stop { fill: var(--bad); }
.m-entry { fill: var(--ink-2); }
.ll { fill: var(--ink); font: 600 12px var(--f-cond); letter-spacing: 0.06em; text-transform: uppercase; }
.lv-v { fill: var(--ink-2); font: 500 12px var(--f-body); }
.endv { fill: var(--ink); font: 600 12px var(--f-body); }
.xh line { stroke: var(--ink-2); stroke-width: 1; }
.xh circle { fill: var(--price); stroke: var(--surface); stroke-width: 2; }
.tip {
  position: absolute; top: 6px; left: 0; z-index: 3; pointer-events: none; white-space: nowrap;
  background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 6px;
  padding: 6px 9px; font-size: 12px; line-height: 1.4; box-shadow: 0 2px 8px var(--shadow);
}
.tip[hidden] { display: none; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px 16px; }
.stats > div { display: grid; gap: 4px; min-width: 0; align-content: start; }
.stats dt { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.stats dd { font-weight: 600; font-size: 19px; line-height: 1.15; }
.stats dd small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.ico { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; display: inline-block; }
.ico.up { border-bottom: 7px solid var(--good); }
.ico.down { border-top: 7px solid var(--bad); }
.limits { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.limits i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.limits.over i { background: var(--bad); }
form.fill { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; padding-top: 12px; border-top: 1px solid var(--grid); }
.field { display: grid; gap: 5px; }
input[type="number"] {
  width: 116px; font: 500 15px var(--f-body); color: var(--ink); background: var(--plane);
  border: 1px solid var(--axis); border-radius: 6px; padding: 7px 9px;
}
input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input:disabled, button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn {
  font: 600 14px var(--f-cond); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  padding: 9px 14px 8px; border-radius: 6px; border: 1px solid var(--axis); background: transparent; color: var(--ink);
}
.btn.primary { background: var(--ink); color: var(--surface); border-color: transparent; }
.msg { font-size: 13px; color: var(--ink-2); min-height: 1.2em; }
details.numbers { font-size: 13px; color: var(--ink-2); }
details.numbers summary { cursor: pointer; }
.tablewrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--muted); }
.why { color: var(--ink-2); font-size: 14px; text-wrap: pretty; }
.flags { list-style: none; padding: 0; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.flags b { font: 600 12px var(--f-cond); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); margin-right: 6px; }
.notes { color: var(--muted); font-size: 13px; display: grid; gap: 6px; max-width: 86ch; }
@media (prefers-reduced-motion: no-preference) { .meter > i { transition: width 0.25s ease; } }
@media (max-width: 480px) { h1 { font-size: 38px; } .tk { font-size: 28px; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Practice portfolio</div>
      <h1>Trade Board</h1>
      <p class="asof" id="asof"></p>
    </div>
    <div class="chips" id="top-chips"><span class="chip paper">Paper money</span></div>
  </header>

  <section class="tiles" id="tiles" aria-label="Risk summary"></section>
  <p class="howto" id="howto"></p>

  <section aria-labelledby="h-trades">
    <h2 id="h-trades">Practice trades</h2>
    <div class="grid" id="trades"></div>
  </section>

  <section aria-labelledby="h-watch">
    <h2 id="h-watch">Watch only</h2>
    <div class="grid" id="watch"></div>
  </section>

  <footer class="notes" id="notes"></footer>
</div>

<script type="application/json" id="board-data">__DATA__</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('board-data').textContent);
  var st = { fills: {}, cfg: { msft: false }, draft: {}, canWrite: null, db: null };
  var T = {};

  function $(s, r) { return (r || document).querySelector(s); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function usd(n, d) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function price(n) { return usd(n, n >= 1 ? 2 : 4); }
  function p1(n) { return Math.abs(n).toFixed(1) + '%'; }
  function dlabel(iso, short) {
    var d = new Date(iso + 'T00:00:00Z');
    return short
      ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' })
      : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  }
  function words(change) { return (change >= 0 ? 'up ' : 'down ') + p1(change); }
  function niceTicks(lo, hi, n) {
    var step0 = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;
    var step = (err <= 1.5 ? 1 : err <= 3 ? 2 : err <= 7 ? 5 : 10) * mag, out = [];
    for (var v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(+v.toFixed(10));
    return { ticks: out, step: step };
  }

  /* ---------- chart ---------- */
  function Chart(host, getModel) {
    var m, W, H, M, priceW, xs, ys, n, uid = 0;
    var tip = el('div', 'tip'); tip.hidden = true;
    var sr = el('div', 'sr'); sr.setAttribute('aria-live', 'polite');
    var cur = null;

    function pathOf(vals) {
      var s = '', open = false;
      vals.forEach(function (v, i) {
        if (v == null) { open = false; return; }
        s += (open ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1); open = true;
      });
      return s;
    }
    function draw() {
      m = getModel(); n = m.c.length;
      W = Math.max(260, Math.floor(host.clientWidth)); H = m.height;
      var narrow = W < 520, hasLv = m.levels.length > 0;
      M = { l: 48, r: hasLv ? (narrow ? 86 : 156) : (narrow ? 74 : 84), t: 12, b: 28 };
      var pw = W - M.l - M.r, ph = H - M.t - M.b;
      priceW = pw * (m.zone ? (narrow ? 0.8 : 0.78) : 1);
      xs = function (i) { return M.l + (n === 1 ? priceW / 2 : i / (n - 1) * priceW); };
      var vals = m.c.concat(m.levels.map(function (l) { return l.v; }));
      var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), pad = (hi - lo) * 0.07 || hi * 0.03;
      lo -= pad; hi += pad;
      ys = function (v) { return M.t + (hi - v) / (hi - lo) * ph; };
      var tk = niceTicks(lo, hi, 4), dec = Math.max(0, -Math.floor(Math.log10(tk.step)));
      var cid = 'clip' + (++uid);
      var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="presentation">' +
        '<defs><clipPath id="' + cid + '"><rect x="' + M.l + '" y="' + M.t + '" width="' + (W - M.l - M.r) + '" height="' + ph + '"/></clipPath></defs>';
      tk.ticks.forEach(function (t) {
        var y = ys(t);
        s += '<line class="g" x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>' +
             '<text class="tl" x="' + (M.l - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + t.toFixed(dec) + '</text>';
      });
      var yb = M.t + ph;
      s += '<line class="ax" x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + yb + '" y2="' + yb + '"/>';
      var lastX = -99;
      for (var i = 0; i < n; i++) {
        var iso = m.d[i], newMonth = i === 0 || iso.slice(5, 7) !== m.d[i - 1].slice(5, 7), label = null;
        if (n > 40 ? newMonth : (i % Math.max(1, Math.ceil(n / Math.max(2, Math.floor(priceW / 74)))) === 0)) {
          label = n > 40
            ? new Date(iso + 'T00:00:00Z').toLocaleDateString('en-GB', { month: 'short', timeZone: 'UTC' })
            : dlabel(iso, true);
        }
        if (label && xs(i) - lastX >= 56 && xs(i) <= M.l + priceW - 6) {
          s += '<text class="xl" x="' + xs(i).toFixed(1) + '" y="' + (yb + 18) + '" text-anchor="middle">' + label + '</text>'; lastX = xs(i);
        }
      }
      if (m.zone) {
        var zx = xs(n - 1), zw = W - M.r - zx, yt = ys(m.zone.target), ye = ys(m.zone.entry), yst = ys(m.zone.stop);
        s += '<rect class="z-good" x="' + zx.toFixed(1) + '" y="' + yt.toFixed(1) + '" width="' + zw.toFixed(1) + '" height="' + (ye - yt).toFixed(1) + '"/>' +
             '<rect class="z-bad" x="' + zx.toFixed(1) + '" y="' + ye.toFixed(1) + '" width="' + zw.toFixed(1) + '" height="' + (yst - ye).toFixed(1) + '"/>';
      }
      m.levels.forEach(function (l) {
        var y = ys(l.v).toFixed(1);
        s += '<line class="lv ' + l.key + '" x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + y + '" y2="' + y + '"/>';
      });
      if (m.a) s += '<path class="avg" clip-path="url(#' + cid + ')" d="' + pathOf(m.a) + '"/>';
      s += '<path class="pr" clip-path="url(#' + cid + ')" d="' + pathOf(m.c) + '"/>';
      var ex = xs(n - 1), ey = ys(m.c[n - 1]);
      s += '<circle class="dot" cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="4"/>';
      if (!hasLv) s += '<text class="endv" x="' + (ex + 10).toFixed(1) + '" y="' + (ey + 4).toFixed(1) + '">' + price(m.c[n - 1]) + '</text>';
      var ly = m.levels.map(function (l) { return { l: l, y: ys(l.v) }; }).sort(function (a, b) { return a.y - b.y; });
      for (var k = 1; k < ly.length; k++) if (ly[k].y - ly[k - 1].y < 16) ly[k].y = ly[k - 1].y + 16;
      ly.forEach(function (o) {
        var x = W - M.r + 9, y = o.y, py = ys(o.l.v), mk;
        if (o.l.key === 'target') mk = (x - 4) + ',' + (py + 3) + ' ' + (x + 4) + ',' + (py + 3) + ' ' + x + ',' + (py - 4);
        else if (o.l.key === 'stop') mk = (x - 4) + ',' + (py - 3) + ' ' + (x + 4) + ',' + (py - 3) + ' ' + x + ',' + (py + 4);
        else mk = x + ',' + (py - 4) + ' ' + (x + 4) + ',' + py + ' ' + x + ',' + (py + 4) + ' ' + (x - 4) + ',' + py;
        s += '<polygon class="m-' + o.l.key + '" points="' + mk + '"/>' +
             '<text x="' + (x + 9) + '" y="' + (y + 4).toFixed(1) + '"><tspan class="ll">' + o.l.label + '</tspan>' +
             (narrow ? '' : '<tspan class="lv-v" dx="6">' + price(o.l.v) + '</tspan>') + '</text>';
      });
      s += '<g class="xh" visibility="hidden"><line x1="0" x2="0" y1="' + M.t + '" y2="' + yb + '"/><circle cx="0" cy="0" r="4"/></g>';
      s += '<rect class="hit" x="' + M.l + '" y="0" width="' + priceW.toFixed(1) + '" height="' + H + '" fill="transparent"/></svg>';
      host.innerHTML = s; host.appendChild(tip); host.appendChild(sr);
      host.setAttribute('aria-label', m.name + ' closing prices for the last ' + n + ' days. Last close ' + price(m.c[n - 1]) +
        ' on ' + dlabel(m.d[n - 1]) + '. Use the left and right arrow keys to read each day.');
      if (cur !== null) show(Math.min(cur, n - 1), false);
    }
    function show(i, speak) {
      cur = i;
      var x = xs(i), y = ys(m.c[i]), g = host.querySelector('.xh');
      if (!g) return;
      g.setAttribute('visibility', 'visible');
      g.querySelector('line').setAttribute('x1', x); g.querySelector('line').setAttribute('x2', x);
      g.querySelector('circle').setAttribute('cx', x); g.querySelector('circle').setAttribute('cy', y);
      var ch = i > 0 ? (m.c[i] / m.c[i - 1] - 1) * 100 : null;
      var txt = dlabel(m.d[i]) + '. Close ' + price(m.c[i]) + (ch === null ? '' : ', ' + words(ch) + ' on the day') +
        (m.a && m.a[i] != null ? '. ' + D.averageBars + ' bar average ' + price(m.a[i]) : '') + '.';
      tip.innerHTML = '<b>' + dlabel(m.d[i]) + '</b><br>Close ' + price(m.c[i]) + (ch === null ? '' : ' (' + words(ch) + ')') +
        (m.a && m.a[i] != null ? '<br>' + D.averageBars + ' bar average ' + price(m.a[i]) : '');
      tip.hidden = false;
      var tw = tip.offsetWidth, left = x + 14;
      if (left + tw > W - 4) left = x - tw - 14;
      tip.style.left = Math.max(4, left) + 'px';
      if (speak) sr.textContent = txt;
    }
    function hide() { cur = null; var g = host.querySelector('.xh'); if (g) g.setAttribute('visibility', 'hidden'); tip.hidden = true; }
    function at(e) {
      var r = host.getBoundingClientRect(), px = e.clientX - r.left;
      if (px < M.l - 6 || px > M.l + priceW + 6) return null;
      return Math.max(0, Math.min(n - 1, Math.round((px - M.l) / priceW * (n - 1))));
    }
    host.addEventListener('pointermove', function (e) { var i = at(e); if (i === null) hide(); else show(i, false); });
    host.addEventListener('pointerleave', function () { if (document.activeElement !== host) hide(); });
    host.addEventListener('focus', function () { show(cur === null ? n - 1 : cur, true); });
    host.addEventListener('blur', hide);
    host.addEventListener('keydown', function (e) {
      var i = cur === null ? n - 1 : cur;
      if (e.key === 'ArrowLeft') i = Math.max(0, i - 1);
      else if (e.key === 'ArrowRight') i = Math.min(n - 1, i + 1);
      else if (e.key === 'Home') i = 0;
      else if (e.key === 'End') i = n - 1;
      else if (e.key === 'Escape') { hide(); return; }
      else return;
      e.preventDefault(); show(i, true);
    });
    if (window.ResizeObserver) {
      var raf = 0, lastW = 0;
      new ResizeObserver(function () {
        var w = Math.floor(host.clientWidth);
        if (w === lastW) return; lastW = w;
        cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
      }).observe(host);
    }
    return { draw: draw };
  }

  function legend(levels) {
    function key(cls, dash) { return '<svg viewBox="0 0 22 8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" class="' + cls + '"' + (dash ? ' stroke-dasharray="5 4"' : '') + '/></svg>'; }
    var h = '<span>' + key('k-price') + 'Close</span><span>' + key('k-avg') + D.averageBars + ' bar average</span>';
    if (levels) h += '<span>' + key('k-entry', 1) + 'Entry</span><span>' + key('k-stop', 1) + 'Stop</span><span>' + key('k-target', 1) + 'Target</span>';
    return h;
  }
  function table(series, rows) {
    var n = series.d.length, from = Math.max(0, n - rows), h = '<table><thead><tr><th>Day</th><th>Close</th><th>' + D.averageBars + ' bar average</th><th>Day change</th></tr></thead><tbody>';
    for (var i = n - 1; i >= from; i--) {
      var ch = i > 0 ? words((series.c[i] / series.c[i - 1] - 1) * 100) : '';
      h += '<tr><td>' + dlabel(series.d[i]) + '</td><td>' + price(series.c[i]) + '</td><td>' + (series.a[i] == null ? '' : price(series.a[i])) + '</td><td>' + ch + '</td></tr>';
    }
    return h + '</tbody></table>';
  }

  /* ---------- trade numbers ---------- */
  function isActive(t) { return t.optional ? !!st.cfg.msft : true; }
  function eff(t) {
    var f = st.draft[t.symbol] || st.fills[t.symbol];
    var entry = f && f.fill > 0 ? f.fill : t.refClose, shares = f && f.shares > 0 ? f.shares : t.shares;
    return {
      entry: entry, shares: shares, stop: entry - t.stopGap, target: entry + 2 * t.stopGap,
      position: shares * entry, risk: shares * t.stopGap, reward: shares * 2 * t.stopGap,
      status: st.draft[t.symbol] ? 'preview' : st.fills[t.symbol] ? 'filled' : 'planned'
    };
  }

  /* ---------- build ---------- */
  function buildTicket(t) {
    var root = el('article', 'ticket'), sym = t.symbol;
    root.innerHTML =
      '<div class="head"><span class="tk"></span><span class="nm"></span><span class="chips"></span></div>' +
      '<p class="plan"></p>' +
      '<div class="legend" aria-label="Chart key">' + legend(true) + '</div>' +
      '<div class="chart" tabindex="0" role="group"></div>' +
      '<dl class="stats">' +
        '<div><dt>Position</dt><dd class="s-pos"></dd></div>' +
        '<div><dt><span class="ico down"></span>At risk</dt><dd class="s-risk"></dd></div>' +
        '<div><dt><span class="ico up"></span>Reward</dt><dd class="s-rew"></dd></div>' +
        '<div><dt>Target odds</dt><dd class="s-odds"></dd></div>' +
      '</dl>' +
      '<p class="limits"><i></i><span></span></p>' +
      '<form class="fill" autocomplete="off">' +
        '<div class="field"><label for="fill-' + sym + '">Your fill price</label><input id="fill-' + sym + '" type="number" inputmode="decimal" step="0.01" min="0"></div>' +
        '<div class="field"><label for="sh-' + sym + '">Shares filled</label><input id="sh-' + sym + '" type="number" inputmode="numeric" step="1" min="1"></div>' +
        '<button type="submit" class="btn primary">Save fill</button>' +
        '<button type="button" class="btn" data-act="clear">Clear</button>' +
      '</form>' +
      '<p class="msg" role="status"></p>' +
      '<details class="numbers"><summary>Show the numbers</summary><div class="tablewrap"></div></details>' +
      '<p class="why"></p>';
    $('.tk', root).textContent = sym; $('.nm', root).textContent = t.name;
    $('.why', root).textContent = t.reason;
    $('.tablewrap', root).innerHTML = table(t.series, 15);
    $('#fill-' + sym, root).placeholder = t.refClose.toFixed(2);
    $('#sh-' + sym, root).placeholder = String(t.shares);
    if (t.optional) {
      var lab = el('label', 'toggle'), cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = 'use-' + sym; lab.appendChild(cb); lab.appendChild(document.createTextNode('Use this trade'));
      $('.head', root).insertBefore(lab, $('.chips', root));
      cb.addEventListener('change', function () { setCfg({ msft: cb.checked }); });
    }
    var chart = Chart($('.chart', root), function () {
      var e = eff(t);
      return { name: sym, d: t.series.d, c: t.series.c, a: t.series.a, height: 252, zone: { entry: e.entry, stop: e.stop, target: e.target },
        levels: [{ key: 'target', label: 'Target', v: e.target }, { key: 'entry', label: e.status === 'planned' ? 'Entry' : 'Fill', v: e.entry }, { key: 'stop', label: 'Stop', v: e.stop }] };
    });
    var inFill = $('#fill-' + sym, root), inSh = $('#sh-' + sym, root), form = $('form', root), msg = $('.msg', root);
    function readDraft() {
      var f = parseFloat(inFill.value), s = parseInt(inSh.value, 10);
      if (f > 0) st.draft[sym] = { fill: f, shares: s > 0 ? s : t.shares }; else delete st.draft[sym];
      update();
    }
    inFill.addEventListener('input', readDraft); inSh.addEventListener('input', readDraft);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var f = parseFloat(inFill.value), s = parseInt(inSh.value, 10) || t.shares;
      if (!(f > 0 && f < 100000)) { msg.textContent = 'Type the price your order filled at, for example ' + t.refClose.toFixed(2) + '.'; return; }
      if (!(s > 0 && s < 100000)) { msg.textContent = 'Shares must be a whole number above zero.'; return; }
      if (!st.db) { msg.textContent = 'Preview only. Open this page signed in to keep fills.'; return; }
      msg.textContent = 'Saving...';
      st.db.doc('fills/' + sym).set({ symbol: sym, fill: f, shares: s, filledOn: new Date().toISOString().slice(0, 10), savedAt: new Date().toISOString() })
        .then(function () { delete st.draft[sym]; msg.textContent = 'Saved. Claude can see this fill.'; update(); })
        .catch(function () { msg.textContent = 'Could not save. Try again in a moment.'; });
    });
    $('[data-act="clear"]', root).addEventListener('click', function () {
      delete st.draft[sym]; inFill.value = ''; inSh.value = '';
      if (st.db && st.fills[sym]) {
        st.db.doc('fills/' + sym).delete().then(function () { msg.textContent = 'Fill cleared.'; update(); }).catch(function () { msg.textContent = 'Could not clear. Try again.'; });
      } else { msg.textContent = ''; update(); }
    });
    T[sym] = { t: t, root: root, chart: chart, inFill: inFill, inSh: inSh, form: form, msg: msg };
    return root;
  }

  function buildWatch(w) {
    var root = el('article', 'ticket'), s = w.stats;
    root.innerHTML =
      '<div class="head"><span class="tk"></span><span class="nm"></span><span class="chips"><span class="chip off"><i></i>Watch only</span></span></div>' +
      '<p class="plan"></p><div class="legend" aria-label="Chart key">' + legend(false) + '</div><div class="chart" tabindex="0" role="group"></div>' +
      '<ul class="flags"></ul><p class="why"></p>' +
      '<details class="numbers"><summary>Show the numbers</summary><div class="tablewrap"></div></details>';
    $('.tk', root).textContent = w.symbol; $('.nm', root).textContent = w.name; $('.why', root).textContent = w.why;
    var line = 'Last close ' + price(s.last) + '.';
    if (s.change20 != null) line += ' ' + (s.change20 >= 0 ? 'Up ' : 'Down ') + p1(s.change20) + ' over 20 days.';
    else if (s.change5 != null) line += ' ' + (s.change5 >= 0 ? 'Up ' : 'Down ') + p1(s.change5) + ' over 5 days.';
    $('.plan', root).textContent = line;
    w.flags.forEach(function (f) { var li = el('li'); li.appendChild(el('b', null, f.name)); li.appendChild(document.createTextNode(f.text)); $('.flags', root).appendChild(li); });
    $('.tablewrap', root).innerHTML = table(w.series, 15);
    var chart = Chart($('.chart', root), function () { return { name: w.symbol, d: w.series.d, c: w.series.c, a: w.series.a.some(function (v) { return v != null; }) ? w.series.a : null, height: 190, levels: [], zone: null }; });
    return { root: root, chart: chart };
  }

  /* ---------- update ---------- */
  function chip(cls, text) { var c = el('span', 'chip ' + cls); c.appendChild(el('i')); c.appendChild(document.createTextNode(text)); return c; }
  function updateTicket(sym) {
    var o = T[sym], t = o.t, e = eff(t), on = isActive(t), root = o.root;
    root.classList.toggle('off', !on);
    var chips = $('.chips', root); chips.textContent = '';
    if (t.optional && !on) chips.appendChild(chip('off', 'Optional, off'));
    else chips.appendChild(chip(e.status, e.status === 'filled' ? 'Filled' : e.status === 'preview' ? 'Preview' : 'Planned'));
    var cb = $('#use-' + sym, root); if (cb) { cb.checked = on; cb.disabled = st.canWrite === false; }
    var plan = $('.plan', root); plan.textContent = '';
    var b1 = el('b', null, e.shares + ' shares');
    plan.appendChild(document.createTextNode(e.status === 'planned' ? 'Buy ' : e.status === 'preview' ? 'If filled: ' : 'Filled '));
    plan.appendChild(b1);
    plan.appendChild(document.createTextNode(e.status === 'planned' ? ' at market at the open (about ' + price(e.entry) + ' from Tuesday’s close). Stop ' : ' at ' + price(e.entry) + '. Stop '));
    plan.appendChild(el('b', null, price(e.stop)));
    plan.appendChild(document.createTextNode(', target '));
    plan.appendChild(el('b', null, price(e.target)));
    plan.appendChild(document.createTextNode('.'));
    $('.s-pos', root).innerHTML = ''; var a = $('.s-pos', root);
    a.appendChild(document.createTextNode(usd(e.position, 0))); a.appendChild(el('small', null, p1(e.position / D.account * 100) + ' of the account'));
    var r = $('.s-risk', root); r.textContent = usd(e.risk, 0); r.appendChild(el('small', null, p1(e.risk / D.account * 100) + ' of the account if the stop hits'));
    var w = $('.s-rew', root); w.textContent = usd(e.reward, 0); w.appendChild(el('small', null, '2 to 1 if the target hits'));
    var od = $('.s-odds', root); od.textContent = t.odds.replace(' percent', '%'); od.appendChild(el('small', null, 'my guess. Break even is 33%'));
    var over = [];
    if (e.position / D.account * 100 > D.positionCapPct + 0.05) over.push('Over the ' + D.positionCapPct + '% limit for one stock.');
    if (e.risk / D.account * 100 > 2 + 0.05) over.push('Risk is over 2% of the account.');
    var lim = $('.limits', root); lim.classList.toggle('over', over.length > 0);
    $('span', lim).textContent = over.length ? over.join(' ') : 'Within the limits: ' + D.positionCapPct + '% in one stock, 2% risk per trade.';
    var focused = document.activeElement;
    if (!st.draft[sym] && focused !== o.inFill && focused !== o.inSh) {
      var f = st.fills[sym]; o.inFill.value = f ? f.fill : ''; o.inSh.value = f ? f.shares : '';
    }
    var can = st.canWrite !== false;
    $('button[type="submit"]', root).disabled = !can; $('[data-act="clear"]', root).disabled = !can;
    o.chart.draw();
  }
  function updateTiles() {
    var act = D.trades.filter(isActive), inv = 0, risk = 0;
    act.forEach(function (t) { var e = eff(t); inv += e.position; risk += e.risk; });
    var invPct = inv / D.account * 100, riskPct = risk / D.account * 100, over = invPct > D.investedCapPct;
    var tiles = $('#tiles'); tiles.textContent = '';
    function tile(k, v, s, extra) { var d = el('div', 'tile'); d.appendChild(el('div', 'k', k)); d.appendChild(el('div', 'v', v)); d.appendChild(el('div', 's', s)); if (extra) d.appendChild(extra); tiles.appendChild(d); }
    var meter = el('div', 'meter' + (over ? ' over' : '')), fill = el('i'), cap = el('b');
    fill.style.width = Math.min(100, invPct) + '%'; cap.style.left = D.investedCapPct + '%'; meter.appendChild(fill); meter.appendChild(cap);
    tile('Invested', invPct.toFixed(0) + '%', 'of the account. The black mark is the ' + D.investedCapPct + '% limit.', meter);
    tile('Money at risk', usd(risk, 0), riskPct.toFixed(1) + '% of the account if every stop is hit. Gaps can make a real loss bigger.');
    var pips = el('div', 'pips');
    for (var i = 0; i < D.maxPositions; i++) pips.appendChild(el('span', i < act.length ? 'on' : ''));
    tile('Positions', act.length + ' of ' + D.maxPositions, 'open at once at most.', pips);
  }
  function update() { Object.keys(T).forEach(updateTicket); updateTiles(); }

  /* ---------- page text ---------- */
  $('#asof').textContent = 'Real daily prices through the close of ' + dlabel(D.asOf) + '. Orders go in before the open on ' + dlabel(D.written) + ' (9:30 New York time).';
  $('#howto').textContent = 'The blue line is the daily close and the gray line is its ' + D.averageBars + ' bar average. The box on the right is the plan: green is what you aim to win, red is what you lose if the stop is hit. Type the price your order really filled at and the lines move to it.';
  var notes = $('#notes');
  [
    'Sizes assume a ' + usd(D.account, 0) + ' account. Each trade risks ' + D.riskPct + '% of it, with at most ' + D.positionCapPct + '% in one stock and ' + D.investedCapPct + '% invested in total.',
    'The stop sits 2 ATR below the entry. ATR is the typical daily swing over the last 14 days. The target is twice as far above the entry as the stop is below it.',
    'Prices come from Yahoo Finance, adjusted for splits and dividends, through ' + dlabel(D.asOf) + '. Practice only. No order is placed from this page and nothing here is advice.'
  ].concat(D.warnings || []).forEach(function (t) { notes.appendChild(el('p', null, t)); });

  var grid = $('#trades'), wgrid = $('#watch');
  D.trades.forEach(function (t) { grid.appendChild(buildTicket(t)); });
  var charts = D.watch.map(function (w) { var b = buildWatch(w); wgrid.appendChild(b.root); return b.chart; });
  update(); charts.forEach(function (c) { c.draw(); });

  /* ---------- saved fills (the db capability) ---------- */
  function setCfg(patch) {
    st.cfg = Object.assign({}, st.cfg, patch); update();
    if (st.db) st.db.doc('plan/config').set(st.cfg).catch(function () {});
  }
  (function wire() {
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db) return;
      st.db = db;
      return (user ? user.can('data.write') : Promise.resolve(null)).then(function (cw) {
        st.canWrite = cw;
        db.collection('fills').onSnapshot(function (snap) {
          var m = {}; snap.docs.forEach(function (d) { var v = d.data(); if (v) m[d.id] = v; });
          st.fills = m; update();
        }, function () {});
        db.doc('plan/config').onSnapshot(function (snap) {
          st.cfg = Object.assign({ msft: false }, snap.data() || {}); update();
        }, function () {});
      });
    }).catch(function () {});
  })();
})();
</script>
